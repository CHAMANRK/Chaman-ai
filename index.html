<!DOCTYPE html>
<!--
  ★★★ ICON RULE (poori app ke liye) ★★★
  Is app mein SIRF icons8.com ka "LED" style use hota hai:
    https://icons8.com/icons/set/led
  URL pattern: https://img.icons8.com/led/{size}/{icon-name}.png
  Koi bhi doosra icons8 style (ios7, m_outlined, dotty, material, etc.) YA kisi
  aur site/icon-pack ka icon is app mein add mat karo — poori app mein ek hi
  consistent LED look rakhna hai. Naya icon chahiye ho to pehle
  https://icons8.com/icons/set/led pe search karke exact "LED style" URL
  confirm karo (icon ke page pe "meta-og:image" / Download button se), phir
  hi use karo.

  ★ EXCEPTIONS (Najeef confirm kiya hai): "search" aur "python" icons ke liye
  LED set mein exact match nahi mila, isliye Dotty ("window-search") aur
  Wired ("python") style temporarily use ho rahe hai. Baaki poori app LED hai.
-->
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content">
<title>Chaman AI</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Scheherazade+New:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  :root{
    --ink:#12100e;
    --ink-2:#1a1713;
    --ink-3:#221e18;
    --line:#332d24;
    --paper:#ede7dd;
    --paper-dim:#a89d8a;
    --amber:#e8a33d;
    --amber-dim:#8a6a30;
    --sage:#7c9473;
    --sage-dim:#3a4235;
    --rust:#b24c2f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    background-image:
      radial-gradient(ellipse 800px 500px at 15% -10%, rgba(232,163,61,0.07), transparent),
      radial-gradient(ellipse 600px 400px at 100% 10%, rgba(124,148,115,0.06), transparent);
    color:var(--paper);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh; /* mobile chrome address-bar ke saath sahi height */
    overflow:hidden;
  }

  /* ── header ── */
  header{
    flex:0 0 auto;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(180deg, var(--ink-2), transparent);
    position:relative;
    z-index:5;
  }
  .icon-btn{
    all:unset;
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    border-radius:8px;
    cursor:pointer;
  }
  .icon-btn:active{background:var(--ink-3);}
  .icon-btn img{width:20px;height:20px;display:block;filter:invert(1);opacity:.9;}
  .burger{display:flex;flex-direction:column;gap:4px;width:18px;}
  .burger span{display:block;height:2px;width:100%;background:var(--paper);border-radius:1px;}

  .chain{display:flex;gap:6px;align-items:center;}
  .chain .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--line);
    transition:background .3s, box-shadow .3s;
  }
  .chain .dot.live{
    background:var(--amber);
    box-shadow:0 0 8px rgba(232,163,61,0.7);
  }
  .token-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--paper-dim);
    letter-spacing:0.02em;
    display:flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
  }
  .token-badge .tb-last{
    color:var(--amber);
    transition:opacity .2s;
  }
  .token-badge .tb-last:empty{display:none;}
  .token-badge .tb-sep{color:var(--line);}
  .bridge-status-line{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; color:var(--paper-dim);
    margin:2px 0 14px;
  }
  .bridge-status-line .dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
  .bridge-status-line .dot.ok{background:var(--sage); box-shadow:0 0 6px rgba(124,148,115,.6);}
  .bridge-status-line .dot.bad{background:var(--rust);}
  .bridge-field-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--paper-dim);
    letter-spacing:0.05em;
    text-transform:uppercase;
    margin:14px 0 6px;
  }
  .bridge-token-row{display:flex; gap:6px;}
  .bridge-token-row input{flex:1; min-width:0;}
  .bridge-token-row button{
    all:unset;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--amber);
    border:1px solid var(--amber-dim);
    border-radius:6px;
    padding:0 12px;
    cursor:pointer;
  }

  /* ── sessions drawer ── */
  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.55);
    opacity:0;pointer-events:none;
    transition:opacity .25s;
    z-index:20;
  }
  .overlay.open{opacity:1;pointer-events:auto;}

  .drawer{
    position:fixed;top:0;left:0;bottom:0;
    width:78%;max-width:280px;
    background:var(--ink-2);
    border-right:1px solid var(--line);
    transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:21;
    display:flex;
    flex-direction:column;
    padding:18px 14px;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:2px 4px 16px;}
  .drawer-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--amber);
    letter-spacing:-0.02em;
  }
  .new-chat-btn{
    all:unset;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    text-align:center;
    padding:10px;
    margin-bottom:16px;
    border:1px solid var(--amber-dim);
    border-radius:9px;
    color:var(--amber);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
  }
  .new-chat-btn img{width:16px;height:16px;display:block;filter:invert(1);opacity:.9;}
  .new-chat-btn:active{background:rgba(232,163,61,0.08);}
  .drawer-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--paper-dim);
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:0 4px 8px;
  }
  .session-list{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .session-row{
    display:flex;
    align-items:center;
    border-radius:8px;
    border-left:2px solid transparent;
  }
  .session-row.active{
    background:var(--ink-3);
    border-left-color:var(--amber);
  }
  .session-item{
    all:unset;
    box-sizing:border-box;
    display:block;
    width:100%;
    min-width:0;
    padding:11px 10px;
    border-radius:8px;
    color:var(--paper-dim);
    font-size:13.5px;
    line-height:1.4;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    -webkit-user-select:none;
    user-select:none;
  }
  .session-row:active .session-item{background:var(--ink-3);}
  .session-row.active .session-item{color:var(--paper);}
  .session-item.pressing{background:var(--ink-3);}
  .session-empty{
    padding:10px;
    color:var(--paper-dim);
    font-size:12.5px;
    font-style:italic;
  }

  /* ── drawer footer (settings entry point) ── */
  .drawer-footer{
    margin-top:auto;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .drawer-footer-btn{
    all:unset;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    padding:11px 10px;
    border-radius:8px;
    color:var(--paper-dim);
    font-size:13.5px;
    cursor:pointer;
  }
  .drawer-footer-btn:active{background:var(--ink-3);}
  .drawer-footer-btn img{width:18px;height:18px;display:block;flex:0 0 auto;filter:invert(1);opacity:.85;}

  /* ── settings page (poori screen ki alag "page" — abhi sirf Profile,
     aage aur bahut saare setting groups yahin isi list style mein add honge) ── */
  .settings-page{
    position:fixed;inset:0;
    background:var(--ink);
    display:flex;
    flex-direction:column;
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:22;
  }
  .settings-page.open{transform:translateX(0);}
  .settings-header{
    flex:0 0 auto;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:10px;
    background:linear-gradient(180deg, var(--ink-2), transparent);
  }
  .settings-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--paper);
    letter-spacing:-0.01em;
  }
  .settings-body{
    flex:1;
    overflow-y:auto;
    padding:16px 14px;
  }
  .settings-row{
    all:unset;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    padding:13px 12px;
    border-radius:9px;
    background:var(--ink-2);
    border:1px solid var(--line);
    cursor:pointer;
  }
  .settings-row:active{background:var(--ink-3);}
  .settings-row-main{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .settings-row-title{font-size:13px;color:var(--paper-dim);}
  .settings-row-value{
    font-size:14.5px;
    color:var(--paper);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .settings-row-arrow{color:var(--paper-dim);font-size:14px;flex:0 0 auto;padding-left:10px;}
  .settings-row-arrow img{width:16px;height:16px;display:block;filter:invert(1);opacity:.7;}

  /* ── generic app modal (session actions, attach menu, etc.) ── */
  .app-modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    opacity:0;pointer-events:none;
    transition:opacity .2s;
    z-index:40;
  }
  .app-modal-overlay.open{opacity:1;pointer-events:auto;}
  .app-modal{
    width:100%;
    max-width:300px;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    transform:scale(0.94) translateY(6px);
    transition:transform .2s;
    box-shadow:0 12px 32px rgba(0,0,0,0.45);
  }
  .app-modal-overlay.open .app-modal{transform:scale(1) translateY(0);}
  .app-modal-title{
    font-size:13px;
    color:var(--paper-dim);
    padding:2px 4px 12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    border-bottom:1px solid var(--line);
    margin-bottom:8px;
  }
  .app-modal-btn{
    all:unset;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:11px;
    width:100%;
    padding:12px 10px;
    border-radius:9px;
    color:var(--paper);
    font-size:14.5px;
    cursor:pointer;
  }
  .app-modal-btn:active{background:var(--ink-3);}
  .app-modal-btn .glyph{width:18px;text-align:center;font-size:15px;color:var(--paper-dim);}
  .app-modal-btn .glyph img{width:18px;height:18px;display:block;filter:invert(1);opacity:.85;}
  .app-modal-btn.danger{color:var(--rust);}
  .app-modal-btn.danger .glyph{color:var(--rust);}
  .app-modal-btn.danger .glyph img{filter:invert(29%) sepia(54%) saturate(1929%) hue-rotate(340deg) brightness(93%) contrast(94%);opacity:1;}
  .app-modal-input{
    all:unset;
    box-sizing:border-box;
    display:block;
    width:100%;
    background:var(--ink-3);
    border:1px solid var(--line);
    border-radius:9px;
    color:var(--paper);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;
    padding:10px 12px;
    margin-bottom:14px;
  }
  .app-modal-input:focus{outline:none;border-color:var(--amber-dim);}
  .app-modal-text{
    font-size:13.5px;
    color:var(--paper-dim);
    line-height:1.5;
    padding:2px 2px 16px;
  }
  .app-modal-footer{
    display:flex;
    gap:8px;
    justify-content:flex-end;
  }
  .app-modal-footer button{
    all:unset;
    box-sizing:border-box;
    padding:9px 15px;
    border-radius:8px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    text-align:center;
  }
  .app-modal-footer .sm-cancel{color:var(--paper-dim);border:1px solid var(--line);}
  .app-modal-footer .sm-cancel:active{background:var(--ink-3);}
  .app-modal-footer .sm-confirm{color:var(--ink);background:var(--amber);font-weight:600;}
  .app-modal-footer .sm-confirm:active{transform:scale(0.96);}
  .app-modal-footer .sm-confirm.danger{background:var(--rust);color:#fff;}

  /* ── chat area ── */
  main{
    flex:1 1 auto;
    min-height:0; /* CRITICAL: without this, flex item won't shrink and pushes the form off-screen */
    overflow-y:auto;
    padding:22px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
    scroll-behavior:smooth;
  }
  main::-webkit-scrollbar{width:0;}

  .empty{
    margin:auto;
    text-align:center;
    color:var(--paper-dim);
    max-width:280px;
  }
  .empty .glyph-big{
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 10px;
  }
  .empty .glyph-big .empty-mark{
    animation-duration:2.6s; /* idle state mein thoda slower/calmer pulse */
  }
  .empty p{font-size:13px;line-height:1.6;margin:0;}

  .row{display:flex;max-width:100%;}
  .row.user{justify-content:flex-end;}
  .row.assistant{justify-content:flex-start;}

  .bubble{
    max-width:82%;
    padding:11px 14px;
    font-size:15px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .row.user .bubble{
    background:var(--sage-dim);
    border:1px solid rgba(124,148,115,0.35);
    color:#dfe8db;
    border-radius:14px 14px 3px 14px;
  }
  .row.assistant .bubble{
    background:transparent;
    border-left:2px solid var(--amber-dim);
    padding-left:13px;
    color:var(--paper);
    border-radius:2px;
    max-width:100%; /* .wrap already caps width at 82% — bubble should fill it fully, not re-shrink */
  }
  .bubble strong{color:var(--amber);font-weight:600;}
  .bubble em{font-style:italic;color:#f3ead8;}
  .bubble .inline-code{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.88em;
    background:var(--ink-3);
    border:1px solid var(--line);
    border-radius:4px;
    padding:1px 5px;
    color:#f0c988;
  }
  .codeblock{
    margin:8px 0;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    background:var(--ink-3);
  }
  .codeblock-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 10px;
    background:var(--ink-2);
    border-bottom:1px solid var(--line);
  }
  .codeblock-head .lang{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--paper-dim);
    text-transform:lowercase;
    letter-spacing:0.03em;
  }
  .copy-btn{
    all:unset;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--amber);
    border:1px solid var(--amber-dim);
    border-radius:5px;
    padding:3px 9px;
    cursor:pointer;
    line-height:1;
  }
  .copy-btn:active{transform:scale(0.94);}
  .copy-btn.copied{color:var(--sage);border-color:var(--sage-dim);}
  .codeblock-actions{display:flex;gap:6px;}
  .run-btn{
    all:unset;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--sage);
    border:1px solid var(--sage-dim);
    border-radius:5px;
    padding:3px 9px;
    cursor:pointer;
    line-height:1;
  }
  .run-btn:active{transform:scale(0.94);}
  .run-btn:disabled{opacity:.4; cursor:not-allowed;}
  .run-btn.running{color:var(--rust); border-color:var(--rust);}
  .run-btn.disabled-hint{opacity:.45; cursor:not-allowed;}
  .codeblock-output{
    border-top:1px solid var(--line);
    background:#0d0b09;
    padding:8px 12px;
    max-height:220px;
    overflow-y:auto;
    display:none;
  }
  .codeblock-output.show{display:block;}
  .codeblock-output pre{
    margin:0;
    white-space:pre-wrap;
    word-break:break-word;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    line-height:1.5;
    color:#c9c0ab;
  }
  .codeblock-output .exit-line{
    margin-top:6px;
    font-size:10.5px;
    color:var(--paper-dim);
    font-family:'IBM Plex Mono',monospace;
  }
  .codeblock-output .exit-line.ok{color:var(--sage);}
  .codeblock-output .exit-line.fail{color:var(--rust);}
  .codeblock-stdin{
    display:flex;
    flex-direction:column;
    gap:4px;
    border-top:1px solid var(--line);
    padding:6px 10px;
  }
  .codeblock-stdin.waiting{
    border-top-color:var(--amber);
  }
  .stdin-wait-hint{
    font-size:11px;
    color:var(--amber);
    font-family:'IBM Plex Mono',monospace;
    display:none;
  }
  .stdin-wait-hint.show{
    display:block;
  }
  .stdin-input-row{
    display:flex;
    gap:6px;
  }
  .stdin-input-row input{
    flex:1;
    min-width:0;
    background:var(--ink-3);
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 8px;
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  .stdin-input-row button{
    all:unset;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--amber);
    padding:6px 10px;
    cursor:pointer;
  }
  .codeblock pre{
    margin:0;
    padding:10px 12px;
    overflow-x:auto;
  }
  .codeblock code{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    line-height:1.5;
    color:#e6ddc9;
    white-space:pre;
  }
  .md-p{margin:0 0 10px;}
  .md-p:last-child{margin-bottom:0;}
  .md-h{
    font-family:'Space Grotesk',sans-serif;
    color:var(--amber);
    line-height:1.3;
    margin:14px 0 8px;
  }
  .bubble > .md-h:first-child{margin-top:0;}
  h1.md-h{font-size:19px;}
  h2.md-h{font-size:17px;}
  h3.md-h{font-size:15.5px;}
  h4.md-h,h5.md-h,h6.md-h{font-size:14.5px;color:var(--paper);}
  .md-list{
    margin:0 0 10px;
    padding-left:20px;
  }
  .md-list li{margin-bottom:4px;line-height:1.5;}
  .md-list:last-child{margin-bottom:0;}
  .md-table-wrap{
    overflow-x:auto;
    margin:8px 0 10px;
    border:1px solid var(--line);
    border-radius:8px;
  }
  /* ── KaTeX math ── */
  .md-math-block{
    overflow-x:auto;
    overflow-y:hidden;
    margin:10px 0;
    padding:10px 12px;
    background:var(--ink-3);
    border:1px solid var(--line);
    border-radius:8px;
    -webkit-overflow-scrolling:touch;
  }
  .md-math-block .katex-display{margin:0;}
  .md-math-inline{
    display:inline-block;
    max-width:100%;
    overflow-x:auto;
    overflow-y:hidden;
    vertical-align:middle;
  }
  .md-math-error{
    color:var(--rust);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
  }
  .katex{color:var(--paper);font-size:1.05em;}
  .katex-display{overflow-x:auto;overflow-y:hidden;}
  .md-table{
    border-collapse:collapse;
    width:100%;
    font-size:13.5px;
  }
  .md-table th,.md-table td{
    padding:7px 11px;
    border-bottom:1px solid var(--line);
    text-align:left;
    white-space:nowrap;
  }
  .md-table th{
    background:var(--ink-3);
    color:var(--amber);
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .md-table tr:last-child td{border-bottom:none;}
  .md-table tr:nth-child(even) td{background:rgba(255,255,255,0.02);}
  .meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--paper-dim);
  }
  .msg-footer{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:6px;
    padding-left:13px;
  }
  .msg-footer .meta{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bridge-inline-actions{
    margin-top:8px;
    padding-left:13px;
  }
  .bridge-inline-connect-btn{
    all:unset;
    box-sizing:border-box;
    display:inline-flex;align-items:center;gap:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--amber);
    border:1px solid var(--amber-dim);
    border-radius:8px;
    padding:8px 14px;
    cursor:pointer;
  }
  .bridge-inline-connect-btn:active{transform:scale(0.96);}
  .msg-copy-btn{
    all:unset;
    box-sizing:border-box;
    flex:0 0 auto;
    display:flex;align-items:center;gap:4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--paper-dim);
    border:1px solid var(--line);
    border-radius:5px;
    padding:3px 8px;
    cursor:pointer;
    line-height:1;
    transition:color .15s, border-color .15s;
  }
  .msg-copy-btn:active{transform:scale(0.94);}
  .msg-copy-btn.copied{color:var(--sage);border-color:var(--sage-dim);}
  .row.assistant .wrap{display:flex;flex-direction:column;max-width:100%;}

  .thinking{
    display:flex;align-items:center;padding-left:13px;padding-top:2px;padding-bottom:2px;
    border-left:2px solid var(--amber-dim);
  }
  .thinking .rs-mark{
    display:block;
    animation:rsBreathe 1.5s ease-in-out infinite;
  }
  @keyframes rsBreathe{
    0%,100%{ transform:scale(1); filter:brightness(1) drop-shadow(0 0 2px rgba(232,163,61,.35)); }
    50%{ transform:scale(1.14); filter:brightness(1.3) drop-shadow(0 0 8px rgba(232,163,61,.8)); }
  }

  /* ── live web search status ── */
  .search-status{
    display:flex;
    align-items:center;
    gap:9px;
    padding-left:13px;
    padding-top:2px;padding-bottom:2px;
    border-left:2px solid var(--amber-dim);
    color:var(--paper-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    transition:border-color .25s, color .25s;
  }
  .search-status .glass{
    display:inline-block;
    font-size:14px;
    animation:search-scan 1.1s ease-in-out infinite;
    transform-origin:70% 70%;
  }
  .search-status .glass img{width:16px;height:16px;display:block;}
  @keyframes search-scan{
    0%,100%{transform:rotate(-10deg) scale(1);}
    50%{transform:rotate(10deg) scale(1.18);}
  }
  .search-status.found .glass,
  .search-status.failed .glass{animation:none;}
  .search-status .status-text .dots::after{
    content:'';
    display:inline-block;
    width:1.2em;
    text-align:left;
    animation:search-dots 1.2s steps(4,end) infinite;
  }
  @keyframes search-dots{
    0%{content:'';}
    25%{content:'.';}
    50%{content:'..';}
    75%{content:'...';}
    100%{content:'';}
  }
  .search-status .scan-bar{
    position:relative;
    width:46px;height:2px;
    border-radius:2px;
    background:var(--line);
    overflow:hidden;
    flex:0 0 auto;
  }
  .search-status .scan-bar::after{
    content:'';
    position:absolute;top:0;left:-40%;
    width:40%;height:100%;
    background:var(--amber);
    border-radius:2px;
    animation:scan-move 1s ease-in-out infinite;
  }
  .search-status.found .scan-bar::after{background:var(--sage);animation:none;left:0;width:100%;}
  .search-status.failed .scan-bar::after{background:var(--rust);animation:none;left:0;width:100%;}
  @keyframes scan-move{
    0%{left:-40%;}
    100%{left:100%;}
  }
  .search-status.found{border-left-color:var(--sage-dim);color:var(--sage);}
  .search-status.failed{border-left-color:var(--rust);color:var(--rust);}

  .err{color:var(--rust);}

  /* ── typewriter cursor ── */
  .bubble.typing::after{
    content:'';
    display:inline-block;
    width:2px;
    height:1em;
    margin-left:2px;
    background:var(--amber);
    vertical-align:text-bottom;
    animation:blink .8s step-end infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  /* ── ask_user action: bottom-sheet card (neeche se slide-up, options
     vertical list mein line-by-line — pehle wale inline circular pills
     narrow mobile width pe overlap kar rahe the, isliye poora hata diya) ── */
  .ask-user-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    z-index:60;
    opacity:0;
    transition:opacity .25s ease;
  }
  .ask-user-backdrop.show{opacity:1;}
  .ask-user-sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:61;
    background:var(--ink-2);
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:14px 16px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
    max-height:70vh;
    overflow-y:auto;
    box-shadow:0 -8px 30px rgba(0,0,0,.4);
  }
  .ask-user-sheet.show{transform:translateY(0);}
  .ask-user-sheet-handle{
    width:36px; height:4px;
    background:var(--line);
    border-radius:999px;
    margin:0 auto 14px;
  }
  .ask-user-sheet-q{
    font-size:15px;
    font-weight:600;
    color:var(--paper);
    margin-bottom:14px;
  }
  .ask-user-sheet-opts{
    display:flex;
    flex-direction:column;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .ask-user-sheet-opt{
    display:flex;
    align-items:flex-start;
    gap:12px;
    width:100%;
    padding:14px 16px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--paper);
    font:inherit;
    font-size:14.5px;
    line-height:1.45;
    text-align:left;
    cursor:pointer;
  }
  .ask-user-sheet-opt:last-child{border-bottom:none;}
  .ask-user-sheet-opt:active{background:var(--ink-3);}
  .ask-user-sheet-opt.selected{color:var(--amber); font-weight:600;}
  .ask-user-sheet-opt .chk{
    width:18px; height:18px;
    margin-top:1px; /* pehli line ke text-baseline ke saath visually align karta hai */
    border-radius:50%;
    border:1.5px solid var(--paper-dim);
    flex:0 0 auto;
  }
  .ask-user-sheet-opt .chk.sq{border-radius:4px;}
  .ask-user-sheet-opt.selected .chk{border-color:var(--amber); background:var(--amber);}
  .ask-user-sheet-opt span:not(.chk){flex:1 1 auto; min-width:0;}
  .ask-user-sheet-confirm{
    display:block;
    width:100%;
    margin-top:14px;
    padding:13px;
    border-radius:12px;
    border:none;
    background:var(--amber);
    color:var(--ink);
    font:inherit;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
  }
  .ask-user-sheet-confirm:disabled{opacity:.4; cursor:not-allowed;}

  /* Options ke neeche "ya apna jawab likho" wala free-text row — taaki user
     sirf AI ke diye options tak limited na rahe. */
  .ask-user-sheet-custom{
    display:flex;
    gap:8px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .ask-user-sheet-custom input{
    flex:1;
    min-width:0;
    background:var(--ink-3);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    color:var(--paper);
    font:inherit;
    font-size:14px;
  }
  .ask-user-sheet-custom button{
    all:unset;
    padding:11px 16px;
    border-radius:10px;
    background:var(--amber);
    color:var(--ink);
    font:inherit;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .ask-user-sheet-custom button:disabled{opacity:.4; cursor:not-allowed;}

  /* Sheet band hone ke baad chat ke andar chhota "jawab" summary reh jaata hai */
  .ask-user-answered{
    margin-top:8px;
    padding-top:10px;
    border-top:1px dashed var(--amber-dim);
    font-size:13px;
    color:var(--amber-dim);
  }
  .ask-user-answered b{color:var(--amber);}

  /* ── jump-to-bottom button (jab user upar scroll kare tab dikhta hai) ── */
  .jump-bottom{
    position:fixed;
    right:16px;
    bottom:calc(78px + env(safe-area-inset-bottom));
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid var(--amber-dim);
    background:var(--ink-2);
    color:var(--amber);
    font-size:16px;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    opacity:0;
    transform:translateY(8px);
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
    z-index:6;
  }
  .jump-bottom.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .jump-bottom:active{transform:scale(0.92);}
  .jump-bottom img{width:18px;height:18px;display:block;filter:invert(1);opacity:.9;}

  /* ── input bar ── */
  form{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    padding:10px 14px calc(14px + env(safe-area-inset-bottom));
    background:var(--ink-2);
    border-top:1px solid var(--line);
  }
  .input-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .attach-btn{
    all:unset;
    box-sizing:border-box;
    flex:0 0 auto;
    width:44px;height:44px;
    border-radius:11px;
    border:1.5px solid var(--amber-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .attach-btn:active{background:rgba(232,163,61,0.12);transform:scale(0.94);}
  .attach-btn{color:var(--amber);}
  .attach-btn img{width:22px;height:22px;display:block;filter:invert(1);opacity:.9;}

  /* ── attached-file chips (input ke upar dikhte hain, send se pehle) ── */
  .attach-chips{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .attach-chips.has-files{margin-bottom:9px;}
  .attach-chip{
    display:flex;
    align-items:center;
    gap:7px;
    max-width:170px;
    background:var(--ink-3);
    border:1px solid var(--line);
    border-radius:8px;
    padding:5px 6px 5px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--paper-dim);
  }
  .attach-chip.reading{border-color:var(--amber-dim);}
  .attach-chip.reading .chip-name{animation:chipPulse 1.1s ease-in-out infinite;}
  @keyframes chipPulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  .attach-chip.unsupported{border-color:var(--rust);}
  .attach-chip .chip-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:var(--paper);
  }
  .attach-chip .chip-remove{
    all:unset;
    box-sizing:border-box;
    position:relative;
    flex:0 0 auto;
    width:18px;height:18px;
    cursor:pointer;
  }
  .attach-chip .chip-remove::before,
  .attach-chip .chip-remove::after{
    content:'';
    position:absolute;
    left:3px;right:3px;
    top:8px;
    height:1.5px;
    background:var(--paper-dim);
    border-radius:1px;
  }
  .attach-chip .chip-remove::before{transform:rotate(45deg);}
  .attach-chip .chip-remove::after{transform:rotate(-45deg);}
  .attach-chip .chip-remove:active::before,
  .attach-chip .chip-remove:active::after{background:var(--rust);}

  /* ── output files produced by the Python sandbox — Claude-style file cards ── */
  .output-files{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:10px;
    max-width:340px;
  }
  .output-file-card{
    all:unset;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:10px 12px;
    background:var(--ink-3);
    border:1px solid var(--line);
    border-radius:14px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .output-file-card:active{background:var(--ink-2); border-color:var(--amber-dim);}
  .output-file-icon{
    flex:0 0 auto;
    width:38px; height:38px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
  }
  .output-file-icon svg{width:19px; height:19px;}
  .output-file-icon.code{background:rgba(232,163,61,.15); color:var(--amber);}
  .output-file-icon.data{background:rgba(124,148,115,.18); color:var(--sage);}
  .output-file-icon.doc{background:rgba(178,76,47,.15); color:var(--rust);}
  .output-file-icon.other{background:rgba(168,157,138,.16); color:var(--paper-dim);}
  .output-file-meta{
    flex:1 1 auto;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .output-file-name{
    font-size:13.5px;
    font-weight:600;
    color:var(--paper);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .output-file-sub{
    font-size:11px;
    color:var(--paper-dim);
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.02em;
  }
  .output-file-download{
    flex:0 0 auto;
    width:30px; height:30px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    color:var(--amber);
  }
  .output-file-download svg{width:16px; height:16px;}
  .output-file-card:active .output-file-download{background:var(--amber); color:var(--ink);}
  .output-file-badge{
    flex:0 0 auto;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:3px 7px;
    border-radius:6px;
    font-family:'IBM Plex Mono',monospace;
  }
  .output-file-badge.modified{background:rgba(232,163,61,.15); color:var(--amber);}
  .output-file-badge.new{background:rgba(124,148,115,.18); color:var(--sage);}

  /* ── Quran Quiz card — [ACTION:quran_quiz_start] ── */
  .quiz-card{
    margin-top:10px;
    max-width:340px;
    background:var(--ink-3);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
  }
  .quiz-card-eyebrow{
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--amber);
    font-weight:700;
    margin-bottom:10px;
  }
  .quiz-card-loading{
    font-size:13px;
    color:var(--paper-dim);
    padding:10px 0;
  }
  .quiz-ayat{
    font-family:'Scheherazade New', serif;
    font-size:23px;
    direction:rtl;
    text-align:center;
    line-height:2;
    color:var(--paper);
    padding:12px 4px;
    border-bottom:1px dashed var(--line);
    margin-bottom:12px;
  }
  .quiz-inputs-row{display:flex; gap:10px; margin-bottom:10px;}
  .quiz-field{flex:1;}
  .quiz-field label{
    display:block;
    font-size:11.5px;
    color:var(--paper-dim);
    margin-bottom:4px;
  }
  .quiz-field input{
    width:100%;
    padding:9px 10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--ink-2);
    color:var(--paper);
    font-size:14px;
    font-family:inherit;
  }
  .quiz-field input:focus{outline:none; border-color:var(--amber);}
  .quiz-submit-btn{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    background:var(--amber);
    color:var(--ink);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    font-family:inherit;
  }
  .quiz-submit-btn:active{transform:scale(.98);}
  .quiz-submit-btn:disabled{opacity:.5; cursor:default;}
  .quiz-feedback{
    margin-top:10px;
    padding:10px 12px;
    border-radius:10px;
    font-size:13.5px;
    line-height:1.5;
  }
  .quiz-feedback.correct{background:rgba(124,148,115,.15); border:1px solid var(--sage); color:#c7dcc0;}
  .quiz-feedback.wrong{background:rgba(178,76,47,.15); border:1px solid var(--rust); color:#f0c3b8;}
  .quiz-error{font-size:12.5px; color:var(--rust); margin-top:6px;}

  /* ── attached-file tags shown inside a sent user bubble ── */
  .msg-files{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:7px;
  }
  .msg-file-tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:rgba(0,0,0,0.18);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:7px;
    padding:4px 9px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#dfe8db;
  }

  textarea{
    flex:1;
    resize:none;
    background:var(--ink-3);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--paper);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:15px;
    padding:11px 12px;
    max-height:110px;
    line-height:1.4;
  }
  textarea:focus{outline:none;border-color:var(--amber-dim);}
  textarea::placeholder{color:var(--paper-dim);}

  button{
    flex:0 0 auto;
    width:42px;height:42px;
    border-radius:10px;
    border:1px solid var(--amber-dim);
    background:var(--amber);
    color:var(--ink);
    font-size:17px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  button:disabled{opacity:.4;cursor:not-allowed;}
  button:active:not(:disabled){transform:scale(0.94);}
  #send img{width:20px;height:20px;display:block;}
  .inline-icon{width:14px;height:14px;vertical-align:-2px;display:inline-block;margin-right:2px;}
</style>
</head>
<body>

<header>
  <button id="menuBtn" class="icon-btn" aria-label="Menu" type="button">
    <img src="https://img.icons8.com/led/32/activity-feed.png" alt="Menu">
  </button>
  <div class="token-badge" id="tokenBadge" title="Is session ka total token usage">
    <span class="tb-last" id="tokenBadgeLast"></span><span class="tb-sep" id="tokenBadgeSep"></span><span id="tokenBadgeTotal">0 tokens</span>
  </div>
  <div class="chain" id="chain">
    <div class="dot" data-provider="Groq"></div>
    <div class="dot" data-provider="OpenRouter"></div>
    <div class="dot" data-provider="Cerebras"></div>
    <div class="dot" data-provider="Mistral"></div>
  </div>
</header>

<div id="overlay" class="overlay"></div>

<aside id="drawer" class="drawer">
  <div class="drawer-head">
    <span class="drawer-title">Chaman AI</span>
  </div>
  <button id="newChatBtn" class="new-chat-btn" type="button">
    <img src="https://img.icons8.com/led/32/filled-plus-2-math.png" alt="">
    <span>Naya chat</span>
  </button>
  <div class="drawer-label">Sessions</div>
  <div id="sessionList" class="session-list"></div>
  <div class="drawer-footer">
    <button id="settingsBtn" class="drawer-footer-btn" type="button">
      <img src="https://img.icons8.com/led/32/automatic.png" alt="">
      <span>Settings</span>
    </button>
  </div>
</aside>

<!-- ── Settings page — alag full "page" jaisa dikhta hai. Abhi sirf Profile
     hai; aage jitne bhi naye settings groups aayenge, sab .settings-body
     ke andar isi list style mein add honge. ── -->
<div id="settingsPage" class="settings-page">
  <div class="settings-header">
    <button id="settingsBackBtn" class="icon-btn" aria-label="Wapas jao" type="button">
      <img src="https://img.icons8.com/led/32/circled-chevron-left.png" alt="">
    </button>
    <span class="settings-title">Settings</span>
  </div>
  <div class="settings-body">
    <div class="drawer-label">Profile</div>
    <button type="button" id="profileRow" class="settings-row">
      <div class="settings-row-main">
        <span class="settings-row-title">Naam</span>
        <span class="settings-row-value" id="profileNameDisplay">—</span>
      </div>
      <span class="settings-row-arrow"><img src="https://img.icons8.com/led/32/edit.png" alt=""></span>
    </button>

    <div class="drawer-label" style="margin-top:18px;">Termux Bridge</div>
    <button type="button" id="bridgeRow" class="settings-row">
      <div class="settings-row-main">
        <span class="settings-row-title">Status</span>
        <span class="settings-row-value" id="bridgeStatusDisplay">Disconnected</span>
      </div>
      <span class="settings-row-arrow"><img src="https://img.icons8.com/led/32/edit.png" alt=""></span>
    </button>
    <!-- Aage aur settings groups (jaise Appearance, Notifications, Data,
         About, etc.) yahin isi neeche add honge -->
  </div>

<script>
  const $main = document.getElementById('main');
  const $form = document.getElementById('form');
  const $input = document.getElementById('input');
  const $send = document.getElementById('send');
  const $dots = document.querySelectorAll('.chain .dot');
  const $tokenBadgeLast = document.getElementById('tokenBadgeLast');
  const $tokenBadgeSep = document.getElementById('tokenBadgeSep');
  const $tokenBadgeTotal = document.getElementById('tokenBadgeTotal');
  const $menuBtn = document.getElementById('menuBtn');
  const $overlay = document.getElementById('overlay');
  const $drawer = document.getElementById('drawer');
  const $newChatBtn = document.getElementById('newChatBtn');
  const $sessionList = document.getElementById('sessionList');
  const $jumpBtn = document.getElementById('jumpBtn');
  const $sessionModalOverlay = document.getElementById('sessionModalOverlay');
  const $sessionModal = document.getElementById('sessionModal');
  const $attachModalOverlay = document.getElementById('attachModalOverlay');
  const $attachModal = document.getElementById('attachModal');
  const $attachBtn = document.getElementById('attachBtn');
  const $fileInput = document.getElementById('fileInput');
  const $attachChips = document.getElementById('attachChips');
  const $settingsBtn = document.getElementById('settingsBtn');
  const $settingsPage = document.getElementById('settingsPage');
  const $settingsBackBtn = document.getElementById('settingsBackBtn');
  const $profileRow = document.getElementById('profileRow');
  const $profileNameDisplay = document.getElementById('profileNameDisplay');
  const $profileModalOverlay = document.getElementById('profileModalOverlay');
  const $profileModal = document.getElementById('profileModal');
  const $bridgeRow = document.getElementById('bridgeRow');
  const $bridgeStatusDisplay = document.getElementById('bridgeStatusDisplay');
  const $bridgeModalOverlay = document.getElementById('bridgeModalOverlay');
  const $bridgeModal = document.getElementById('bridgeModal');
  const $onboardOverlay = document.getElementById('onboardOverlay');
  const $onboardNameInput = document.getElementById('onboardNameInput');
  const $onboardSaveBtn = document.getElementById('onboardSaveBtn');

  let history = []; // {role, content, provider?, model?} — current session ki poori raw chat
  let busy = false;
  let currentAbortController = null; // jo bhi /api/chat request abhi in-flight hai, uska controller — Stop button isi ko abort karta hai
  let activeSessionId = null; // null = abhi tak koi reply nahi aaya, session bana hi nahi

  // ── Token usage counter ─────────────────────────────────────────────
  // Har assistant history-entry apna khud ka token cost store karta hai
  // ({tokens: {prompt,completion,total}}) — isliye session switch/reload
  // pe total hamesha history se hi recompute hota hai (localStorage mein
  // alag se koi running-total store/sync nahi karna padta, single source
  // of truth hamesha history hi rehta hai).
  let sessionTokenTotal = 0;

  function formatTokenCount(n) {
    if (n == null || Number.isNaN(n)) return '?';
    if (n >= 100000) return Math.round(n / 1000) + 'k';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
    return String(n);
  }

  // history se poore session ka total (sab assistant messages ke tokens.total ka sum) nikalta hai.
  function computeSessionTokenTotal(msgs) {
    return (msgs || []).reduce((sum, m) => {
      if (m.role === 'assistant' && m.tokens && typeof m.tokens.total === 'number') {
        return sum + m.tokens.total;
      }
      return sum;
    }, 0);
  }

  // lastTurnTokens = abhi-abhi aaye reply ka cost (badge mein "+X" flash
  // dikhane ke liye) — undefined/omit karo to sirf total refresh hoga.
  function updateTokenBadge(lastTurnTokens) {
    $tokenBadgeTotal.textContent = formatTokenCount(sessionTokenTotal) + ' tokens';
    if (lastTurnTokens != null) {
      $tokenBadgeLast.textContent = '+' + formatTokenCount(lastTurnTokens);
      $tokenBadgeSep.textContent = '·';
    } else {
      $tokenBadgeLast.textContent = '';
      $tokenBadgeSep.textContent = '';
    }
  }

  // Send button ab busy state mein kabhi disable nahi hota — uski jagah wahi
  // button "Stop" ban jaata hai (icon badal jaata hai, clickable rehta hai).
  const SEND_ICON = 'https://img.icons8.com/led/32/sent.png';
  const STOP_ICON = 'https://img.icons8.com/led/32/stop-squared.png';
  function setSendButtonBusy(isBusy) {
    $send.disabled = false;
    $send.innerHTML = isBusy
      ? `<img src="${STOP_ICON}" alt="Rok do" width="20" height="20">`
      : `<img src="${SEND_ICON}" alt="Send" width="20" height="20">`;
    $send.setAttribute('aria-label', isBusy ? 'Rok do' : 'Bhejo');
  }

  // Abhi jo bhi request chal rahi hai use abort kar do — fetchExchange isi
  // controller ko sun raha hota hai, abort hote hi AbortError throw hoga.
  function stopGeneration() {
    if (currentAbortController) currentAbortController.abort();
  }

  // "Stick to bottom" — jab tak user khud upar scroll na kare, naya content
  // aane par hum neeche pin karte rehte hain. Jaise hi user upar scroll karta
  // hai, hum peeche hat jaate hain aur usse manually padhne dete hain — chahe
  // AI abhi bhi lamba jawab generate kar raha ho. Jump button se wapas neeche ja sakta hai.
  let stickToBottom = true;
  // Jab tak user ki ungli/pointer screen par hai (touch ho ya drag), hum
  // scrollTop ko kabhi force se set nahi karte — chahe kitni bhi baar
  // scrollBottom() call ho (jaise typewriter ke har character pe). Pehle
  // sirf touchmove ke baad stickToBottom false hoti thi, lekin agar typing
  // ke time JS thoda busy ho (bahut saare textContent updates), to touchmove
  // handler late fire hota tha aur beech mein forced scrollTop assignments
  // gesture ko "cancel" kar dete the — isse upar scroll karna bahut mushkil
  // lagta tha. Ab touchstart hote hi (movement se pehle hi) forced-scroll
  // turant band ho jaata hai.
  let touching = false;

  const SESSIONS_KEY = 'chamanai_sessions_v1';
  const PROFILE_KEY = 'chamanai_profile_v1'; // { name: "..." } — aage isi object mein aur fields (jaise avatar, preferences) add ho sakte hain

  function loadProfile() {
    try {
      return JSON.parse(localStorage.getItem(PROFILE_KEY)) || null;
    } catch (e) {
      return null;
    }
  }
  function saveProfile(profile) {
    try {
      localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
    } catch (e) {
      console.warn('Profile save fail:', e);
    }
  }

  // ── Termux Bridge: local device connection (loopback-only, token-gated) ──
  // Config sirf { port, token } hai — token wahi hai jo user ke Termux mein
  // `npm start` chalane par ek baar print hota hai, aur yahan paste kiya jaata hai.
  const BRIDGE_KEY = 'chamanai_bridge_v1';
  function loadBridgeConfig() {
    try { return JSON.parse(localStorage.getItem(BRIDGE_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveBridgeConfig(cfg) {
    try { localStorage.setItem(BRIDGE_KEY, JSON.stringify(cfg)); } catch (e) { /* ignore */ }
  }

  function bridgeStatusLabel(status) {
    if (status === 'connected') return 'Connected';
    if (status === 'connecting') return 'Connecting…';
    if (status === 'denied') return 'Permission ya token issue';
    return 'Disconnected';
  }

  // Ek hi global Bridge — kyunki server-side bhi ek time pe sirf ek hi command
  // chalata hai, isliye "kis codeblock ki run chal rahi hai" bhi yahin _current
  // handler ki tarah track hota hai.
  const Bridge = {
    ws: null,
    status: 'disconnected', // disconnected | connecting | connected | denied
    tools: {},
    listeners: new Set(),
    _current: null,

    notify() { this.listeners.forEach((fn) => { try { fn(this.status); } catch (e) {} }); },

    async ensureConnected() {
      if (this.status === 'connected' && this.ws && this.ws.readyState === WebSocket.OPEN) return true;
      if (this.status === 'connecting') {
        return new Promise((resolve) => {
          const check = () => {
            if (this.status === 'connected') resolve(true);
            else if (this.status === 'connecting') setTimeout(check, 200);
            else resolve(false);
          };
          check();
        });
      }
      return this.connect();
    },

    async connect() {
      const cfg = loadBridgeConfig();
      const port = cfg.port || 8787;
      const token = cfg.token || '';
      if (!token) { this.status = 'disconnected'; this.notify(); return false; }

      this.status = 'connecting';
      this.notify();

      // Pehle ek normal fetch — isi se Chrome/Firefox ka Local Network Access
      // permission popup trigger hota hai (WebSocket errors se generic/vague
      // failure milta hai, fetch se cleaner signal milta hai ki permission
      // allow hui ya nahi).
      try {
        const res = await fetch(`http://127.0.0.1:${port}/health?token=${encodeURIComponent(token)}`);
        if (!res.ok) throw new Error('auth_failed');
        const data = await res.json();
        this.tools = data.tools || {};
      } catch (err) {
        this.status = 'denied';
        this.notify();
        return false;
      }

      return new Promise((resolve) => {
        let settled = false;
        let ws;
        try {
          ws = new WebSocket(`ws://127.0.0.1:${port}/bridge?token=${encodeURIComponent(token)}`);
        } catch (e) {
          this.status = 'denied'; this.notify();
          resolve(false);
          return;
        }
        ws.addEventListener('message', (e) => {
          let msg;
          try { msg = JSON.parse(e.data); } catch (err) { return; }
          if (msg.type === 'ready') {
            this.tools = msg.tools || {};
            this.status = 'connected';
            this.notify();
            if (!settled) { settled = true; resolve(true); }
          }
          this.dispatch(msg);
        });
        ws.addEventListener('close', () => {
          this.status = 'disconnected';
          this.notify();
          if (!settled) { settled = true; resolve(false); }
        });
        ws.addEventListener('error', () => {
          this.status = 'denied';
          this.notify();
          if (!settled) { settled = true; resolve(false); }
        });
        this.ws = ws;
      });
    },

    disconnect() {
      if (this.ws) { try { this.ws.close(); } catch (e) {} }
      this.ws = null;
      this.status = 'disconnected';
      this.notify();
    },

    dispatch(msg) {
      // ★ 'reattach' — server ne bataya ki koi command background mein pehle
      // se chal rahi thi (ya abhi khatam hui) jab hum disconnect the. Agar
      // isi tab mein pehle se ek runner card (`_current`) attached hai
      // (jaise phone thodi der lock hua tha aur WS drop hua, lekin tab
      // band nahi hua), to buffered events usi card mein replay kar do —
      // bilkul aisa jaise kuch miss hi nahi hua. Agar `_current` hi nahi hai
      // (poora app reopen hua), to ek chhota system-message dikha do taaki
      // user ko pata chale ki background mein kuch chal/khatam hua tha.
      if (msg.type === 'reattach') {
        if (this._current && Array.isArray(msg.buffer)) {
          for (const buffered of msg.buffer) this.dispatch(buffered);
        } else if (Array.isArray(msg.buffer) && msg.buffer.length) {
          const tail = msg.buffer
            .filter((e) => e.type === 'output')
            .map((e) => e.data)
            .join('')
            .slice(-1500);
          const exitEvt = msg.buffer.find((e) => e.type === 'exit');
          const statusLine = msg.running
            ? '⚙ Termux Bridge: ek command abhi bhi background mein chal rahi thi jab tu disconnect tha — reconnect ho gaya, ye ab tak ka output hai:'
            : `⚙ Termux Bridge: background mein chal rahi command tab tak khatam ho chuki thi (exit code ${exitEvt ? exitEvt.code : '?'}) — ye uska aakhri output hai:`;
          addAssistantBubble(`${statusLine}\n\n\`\`\`\n${tail || '(koi output record nahi mila)'}\n\`\`\``, null, false, false);
        }
        return;
      }
      const runner = this._current;
      if (!runner) return;
      if (msg.type === 'output') runner.onOutput(msg.stream, msg.data);
      else if (msg.type === 'exit') runner.onExit(msg.code);
      else if (msg.type === 'error') runner.onError(msg.message);
      else if (msg.type === 'waiting_input' && runner.onWaitingInput) runner.onWaitingInput(!!msg.waiting);
    },

    async run(command, handlers) {
      this._current = handlers;
      const ok = await this.ensureConnected();
      if (!ok) {
        handlers.onError('Bridge se connect nahi ho saka — Settings → Termux Bridge check karo (Termux mein server chal raha hai? Token sahi paste hua? Browser ka "local network" permission allow kiya?).');
        return;
      }
      this.ws.send(JSON.stringify({ type: 'start', command }));
    },

    sendStdin(data) {
      if (this.ws && this.ws.readyState === WebSocket.OPEN) {
        this.ws.send(JSON.stringify({ type: 'stdin', data }));
      }
    },

    kill() {
      if (this.ws && this.ws.readyState === WebSocket.OPEN) {
        this.ws.send(JSON.stringify({ type: 'kill' }));
      }
    },
  };

  // Termux run ka poora result agla "user" turn ban ke wapas model ko jaata hai —
  // web_search/run_code jaisa hi pattern, isliye AI ko poora context milta hai.
  function formatTermuxResultForModel(command, output, exitCode) {
    const trimmed = (output || '').trim();
    return `[Termux command run hui:]\n$ ${command}\n\n[Output:]\n${trimmed || '(koi output nahi tha)'}\n\n[Exit code: ${exitCode}]\n\n[Iske base pe user ko seedha, natural Hinglish jawab de.]`;
  }

  function loadSessions() {
    try {
      return JSON.parse(localStorage.getItem(SESSIONS_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function isQuotaError(e) {
    return !!e && (
      e.name === 'QuotaExceededError' ||
      e.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
      e.code === 22 ||
      e.code === 1014
    );
  }

  // Sabse purana session hata deta hai — current active session ko (agar possible ho)
  // bacha ke rakhta hai, kyunki wahi abhi save ho raha hota hai.
  function dropOldestSession(sessions) {
    if (sessions.length <= 1) return sessions.slice(0, 0); // ek hi bacha tha, use bhi hata do
    const sorted = [...sessions].sort((a, b) => a.updatedAt - b.updatedAt);
    const victim = sorted.find(s => s.id !== activeSessionId) || sorted[0];
    return sessions.filter(s => s.id !== victim.id);
  }

  // Storage full hone par purani sessions ko aahiste-aahiste (ek-ek karke) hata ke
  // retry karta hai, jab tak naya data fit na ho jaaye ya sessions khatam na ho jaayein.
  function saveSessions(sessions) {
    let list = sessions;
    while (true) {
      try {
        localStorage.setItem(SESSIONS_KEY, JSON.stringify(list));
        return;
      } catch (e) {
        if (!isQuotaError(e) || list.length === 0) {
          console.warn('localStorage save fail:', e);
          return;
        }
        list = dropOldestSession(list);
      }
    }
  }

  function sessionTitle(firstUserMsg) {
    const t = firstUserMsg.trim().replace(/\s+/g, ' ');
    return t.length > 42 ? t.slice(0, 42) + '…' : t;
  }

  // Session sirf tab banta hai jab pehla reply successfully aa jaaye — usse pehle
  // koi entry sidebar mein nahi dikhti, jaisa maanga gaya tha.
  function persistTurn() {
    const sessions = loadSessions();
    if (activeSessionId) {
      const s = sessions.find(s => s.id === activeSessionId);
      if (s) {
        s.messages = history;
        s.updatedAt = Date.now();
      }
    } else {
      const firstUser = history.find(m => m.role === 'user');
      const firstUserMsg = (firstUser && (firstUser.displayText || (firstUser.files && firstUser.files.length ? `File: ${firstUser.files[0].name}` : firstUser.content))) || 'New chat';
      activeSessionId = String(Date.now());
      sessions.unshift({
        id: activeSessionId,
        title: sessionTitle(firstUserMsg),
        messages: history,
        updatedAt: Date.now(),
      });
    }
    saveSessions(sessions);
    renderSessionList();
  }

  function renderSessionList() {
    const sessions = loadSessions().sort((a, b) => b.updatedAt - a.updatedAt);
    $sessionList.innerHTML = '';
    if (!sessions.length) {
      $sessionList.innerHTML = '<div class="session-empty">Abhi koi session nahi — pehla message bhejo.</div>';
      return;
    }
    for (const s of sessions) {
      const row = document.createElement('div');
      row.className = 'session-row' + (s.id === activeSessionId ? ' active' : '');

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'session-item';
      btn.textContent = s.title;
      attachLongPress(btn, s.id);
      row.appendChild(btn);

      $sessionList.appendChild(row);
    }
  }

  // ── Long-press (300ms) session actions ─────────────────────────────
  // Ek chhota hold (~300ms) modal khol deta hai jisme Rename/Delete hote
  // hain — koi icon session row mein hamesha nahi dikhta. Halka sa drag/scroll
  // ho jaaye to press cancel ho jaata hai (taaki list scroll karna na tootey),
  // aur ek normal quick tap session ko open karta hai jaisa pehle hota tha.
  const LONG_PRESS_MS = 300;
  const LONG_PRESS_MOVE_TOLERANCE = 8;

  function attachLongPress(el, sessionId) {
    let timer = null;
    let startX = 0, startY = 0;
    let fired = false;

    function clear() {
      if (timer) { clearTimeout(timer); timer = null; }
      el.classList.remove('pressing');
    }

    el.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      fired = false;
      startX = e.clientX;
      startY = e.clientY;
      timer = setTimeout(() => {
        fired = true;
        el.classList.remove('pressing');
        if (navigator.vibrate) navigator.vibrate(12);
        openSessionMenu(sessionId);
      }, LONG_PRESS_MS);
      el.classList.add('pressing');
    });

    el.addEventListener('pointermove', (e) => {
      if (!timer) return;
      const dx = Math.abs(e.clientX - startX);
      const dy = Math.abs(e.clientY - startY);
      if (dx > LONG_PRESS_MOVE_TOLERANCE || dy > LONG_PRESS_MOVE_TOLERANCE) clear();
    });

    el.addEventListener('pointerup', clear);
    el.addEventListener('pointercancel', clear);
    el.addEventListener('pointerleave', clear);

    el.addEventListener('click', (e) => {
      if (fired) {
        // Long-press ne modal khol diya tha — isse ek normal click ki tarah
        // treat mat karo (session open nahi karna).
        e.preventDefault();
        e.stopPropagation();
        fired = false;
        return;
      }
      openSession(sessionId);
    });
  }

  // ── Generic app modal factory ───────────────────────────────────────
  // Ek hi reusable modal system — session-actions aur attach-menu dono
  // isi se banate hain. Naya modal chahiye ho to bas makeModal(overlay, card)
  // se ek instance bana lo, aur .open(builder) / .close() use karo.
  function makeModal(overlayEl, cardEl) {
    function close() { overlayEl.classList.remove('open'); }
    overlayEl.addEventListener('click', (e) => {
      if (e.target === overlayEl) close();
    });
    return {
      open(contentBuilder) {
        cardEl.innerHTML = '';
        contentBuilder(cardEl);
        overlayEl.classList.add('open');
      },
      close,
    };
  }
  const sessionModal = makeModal($sessionModalOverlay, $sessionModal);
  const attachModal = makeModal($attachModalOverlay, $attachModal);
  const profileModal = makeModal($profileModalOverlay, $profileModal);
  const bridgeModal = makeModal($bridgeModalOverlay, $bridgeModal);

  // ── Settings page ───────────────────────────────────────────────────
  function updateProfileDisplay() {
    const profile = loadProfile();
    $profileNameDisplay.textContent = (profile && profile.name) ? profile.name : 'Naam set nahi hai';
  }

  function updateBridgeStatusDisplay() {
    $bridgeStatusDisplay.textContent = bridgeStatusLabel(Bridge.status);
  }
  Bridge.listeners.add(updateBridgeStatusDisplay);

  function openSettings() {
    updateProfileDisplay();
    updateBridgeStatusDisplay();
    closeDrawer();
    $settingsPage.classList.add('open');
  }
  function closeSettings() {
    $settingsPage.classList.remove('open');
  }
  $settingsBtn.addEventListener('click', openSettings);
  $settingsBackBtn.addEventListener('click', closeSettings);

  function showBridgeSettingsModal() {
    const cfg = loadBridgeConfig();
    bridgeModal.open((root) => {
      const title = document.createElement('div');
      title.className = 'app-modal-title';
      title.textContent = 'Termux Bridge';
      root.appendChild(title);

      const desc = document.createElement('div');
      desc.className = 'app-modal-text';
      desc.textContent = 'Apne Termux mein "npm start" chalao — jo token print hoga, wahi neeche paste karo.';
      root.appendChild(desc);

      const statusLine = document.createElement('div');
      statusLine.className = 'bridge-status-line';
      const dot = document.createElement('span');
      dot.className = 'dot';
      const label = document.createElement('span');
      function refreshStatus() {
        label.textContent = bridgeStatusLabel(Bridge.status);
        dot.className = 'dot' + (Bridge.status === 'connected' ? ' ok' : Bridge.status === 'denied' ? ' bad' : '');
      }
      refreshStatus();
      statusLine.append(dot, label);
      root.appendChild(statusLine);

      const portLabel = document.createElement('div');
      portLabel.className = 'bridge-field-label';
      portLabel.textContent = 'Port';
      root.appendChild(portLabel);
      const portInput = document.createElement('input');
      portInput.type = 'number';
      portInput.className = 'app-modal-input';
      portInput.value = cfg.port || 8787;
      root.appendChild(portInput);

      const tokenLabel = document.createElement('div');
      tokenLabel.className = 'bridge-field-label';
      tokenLabel.textContent = 'Token';
      root.appendChild(tokenLabel);
      const tokenRow = document.createElement('div');
      tokenRow.className = 'bridge-token-row';
      const tokenInput = document.createElement('input');
      tokenInput.type = 'text';
      tokenInput.className = 'app-modal-input';
      tokenInput.placeholder = 'Termux terminal se copy karo';

  // ── File attachments ────────────────────────────────────────────────
  // Har tarah ki file select ki ja sakti hai (koi type restriction nahi).
  // Text/code files poori tarah padh ke content model ko bhej dete hain.
  // PDF se text nikaalne ke liye pdf.js lazily load hota hai (pehli baar
  // koi PDF attach hone par). Baaki (image, docx, zip, etc.) files sirf
  // naam ke saath "attached" note ke roop mein bhejte hain — inka content
  // parse nahi hota, aur model ko ye saaf bataya jaata hai (koi fake
  // extraction nahi dikhaate).
  let attachedFiles = []; // {id, name, size, kind, content, truncated, status}
  const MAX_FILES = 5;
  const MAX_CHARS_PER_FILE = 20000;
  const TEXT_EXTENSIONS = new Set([
    'txt','md','markdown','js','jsx','ts','tsx','py','java','c','cc','cpp','h','hpp',
    'cs','go','rb','php','html','htm','css','scss','less','json','yml','yaml','xml',
    'csv','tsv','sh','bash','zsh','sql','rs','swift','kt','kts','vue','svelte','ini',
    'conf','cfg','env','log','toml','gradle','dockerfile','makefile','r','lua','pl',
  ]);

  function extOf(name) {
    const i = name.lastIndexOf('.');
    return i === -1 ? '' : name.slice(i + 1).toLowerCase();
  }

  function fileKind(file) {
    const ext = extOf(file.name);
    if (file.type === 'application/pdf' || ext === 'pdf') return 'pdf';
    if (file.type.startsWith('text/') || file.type === 'application/json' || TEXT_EXTENSIONS.has(ext)) return 'text';
    return 'unsupported';
  }

  $fileInput.addEventListener('change', () => {
    const files = Array.from($fileInput.files || []);
    $fileInput.value = ''; // reset karo taaki same file dubara select ho sake
    for (const file of files) {
      if (attachedFiles.length >= MAX_FILES) break;
      addAttachedFile(file);
    }
  });

  function addAttachedFile(file) {
    const id = 'f' + Date.now() + Math.random().toString(36).slice(2, 7);
    const kind = fileKind(file);
    const entry = {
      id, name: file.name, size: file.size, kind,
      content: null, truncated: false,
      status: kind === 'unsupported' ? 'unsupported' : 'reading',
    };
    attachedFiles.push(entry);
    renderAttachChips();

    if (kind === 'text') {
      const reader = new FileReader();
      reader.onload = () => {
        let text = String(reader.result || '');
        if (text.length > MAX_CHARS_PER_FILE) {
          text = text.slice(0, MAX_CHARS_PER_FILE);
          entry.truncated = true;
        }
        entry.content = text;
        entry.status = 'ready';
        renderAttachChips();
      };
      reader.onerror = () => { entry.status = 'error'; renderAttachChips(); };
      reader.readAsText(file);
    } else if (kind === 'pdf') {
      readPdfFile(file, entry);
    } else {
      renderAttachChips();
    }
  }

  let pdfJsLoadPromise = null;
  function ensurePdfJs() {
    if (window.pdfjsLib) return Promise.resolve();
    if (pdfJsLoadPromise) return pdfJsLoadPromise;
    pdfJsLoadPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      script.onload = () => {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        resolve();
      };
      script.onerror = () => reject(new Error('pdf.js load fail hua'));
      document.head.appendChild(script);
    });
    return pdfJsLoadPromise;
  }

  async function readPdfFile(file, entry) {
    try {
      await ensurePdfJs();
      const buf = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
      let text = '';
      const maxPages = Math.min(pdf.numPages, 30);
      for (let p = 1; p <= maxPages; p++) {
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        text += content.items.map((it) => it.str).join(' ') + '\n';
        if (text.length > MAX_CHARS_PER_FILE) break;
      }
      const truncated = text.length > MAX_CHARS_PER_FILE || pdf.numPages > maxPages;
      if (text.length > MAX_CHARS_PER_FILE) text = text.slice(0, MAX_CHARS_PER_FILE);
      text = text.trim();
      entry.content = text || null;
      entry.truncated = truncated;
      entry.status = text ? 'ready' : 'unsupported';
    } catch (e) {
      entry.status = 'error';
    }
    renderAttachChips();
  }

  // Attach ki gayi text/pdf files jaise hi "ready" (content extract ho chuka)
  // ho jaati hain, unhe sandboxFiles map mein bhi copy kar dete hain — taaki
  // Python code isi conversation mein unhe filename se open() kar sake.
  // (sandboxFiles poore declaration ke liye neeche "Python Sandbox" section dekho.)
  function syncSandboxFilesFromAttached() {
    if (typeof sandboxFiles === 'undefined') return; // load-order safety
    for (const f of attachedFiles) {
      if (f.status === 'ready' && typeof f.content === 'string') {
        sandboxFiles[f.name] = f.content;
      }
    }
  }

  function removeAttachedFile(id) {
    attachedFiles = attachedFiles.filter((f) => f.id !== id);
    renderAttachChips();
  }

  function renderAttachChips() {
    syncSandboxFilesFromAttached();
    $attachChips.innerHTML = '';
    $attachChips.classList.toggle('has-files', attachedFiles.length > 0);
    for (const f of attachedFiles) {
      const chip = document.createElement('div');
      chip.className = 'attach-chip' +
        (f.status === 'reading' ? ' reading' : '') +
        (f.status === 'unsupported' || f.status === 'error' ? ' unsupported' : '');

      const name = document.createElement('span');
      name.className = 'chip-name';
      name.textContent = f.name;
      chip.appendChild(name);

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'chip-remove';
      remove.setAttribute('aria-label', 'File hatao');
      remove.addEventListener('click', () => removeAttachedFile(f.id));
      chip.appendChild(remove);

      $attachChips.appendChild(chip);
    }
  }

  // History/backend ke liye poora text banata hai — attached files ka content
  // (ya "content nahi mila" note) pehle, phir user ka typed message.
  function buildOutgoingMessage(text, files) {
    if (!files.length) return text;
    const parts = files.map((f) => {
      if (f.status === 'ready' && f.content) {
        const ext = extOf(f.name);
        const note = f.truncated ? '\n... (file lambi thi, truncate ki gayi)' : '';
        return `[Attached file: ${f.name}]\n\`\`\`${ext}\n${f.content}${note}\n\`\`\``;
      }
      return `[Attached file: ${f.name} — content extract nahi ho saka (unsupported type ya error), sirf naam pata hai]`;
    });
    const filesBlock = parts.join('\n\n');
    return text ? `${filesBlock}\n\n${text}` : filesBlock;
  }

  // Keyboard khulne pe kuch Android browsers `interactive-widget=resizes-content`
  // ko ignore karke poore page ko scroll kar dete hain (isse messages "upar" chale
  // jaate hain jab tak khud scroll na karo). visualViewport API se hum body ki
  // height ko keyboard ke hisaab se manually sync karte hain, aur input focus hote
  // hi neeche pin kar dete hain — taaki chat aur input box hamesha visible rahein.
  if (window.visualViewport) {
    const vv = window.visualViewport;
    function syncViewportHeight() {
      document.body.style.height = vv.height + 'px';
      window.scrollTo(0, 0);
      scrollBottom(true);
    }
    vv.addEventListener('resize', syncViewportHeight);
    vv.addEventListener('scroll', () => window.scrollTo(0, 0));
  }
  $input.addEventListener('focus', () => {
    // Keyboard animate hote hue thoda time leta hai — chhota delay ke baad pin karo.
    setTimeout(() => scrollBottom(true), 60);
    setTimeout(() => scrollBottom(true), 300);
  });

  function isNearBottom(px) {
    return $main.scrollHeight - $main.scrollTop - $main.clientHeight <= (px == null ? 64 : px);
  }

  function updateJumpBtn() {
    $jumpBtn.classList.toggle('show', !stickToBottom);
  }

  // force=true wale calls hamesha neeche pin karte hain (jaise user ka apna
  // message bhejna, session kholna, keyboard khulna). Baaki sab (typing/streaming
  // ke dauraan) sirf tab scroll karte hain jab user khud neeche par hi ho —
  // isse agar wo upar scroll kar ke padh raha ho to beech mein rukawat nahi aati.
  function scrollBottom(force) {
    if (touching) return; // user ki ungli abhi screen par hai — kabhi force mat karo
    if (!force && !stickToBottom) return;
    $main.scrollTop = $main.scrollHeight;
    stickToBottom = true;
    updateJumpBtn();
  }

  let scrollTick = null;
  $main.addEventListener('scroll', () => {
    if (scrollTick) return;
    scrollTick = requestAnimationFrame(() => {
      stickToBottom = isNearBottom();
      updateJumpBtn();
      scrollTick = null;
    });
  });

  // CRITICAL: typewriter effect har ~14ms pe DOM update karta hai, aur us hisaab
  // se scrollBottom() bhi utni hi baar call hoti hai. Agar hum sirf 'scroll' event
  // ka wait karte (jo tabhi fire hota hai jab scrollTop already badal chuka ho), to
  // user ka touch-drag aur hamara forced-scroll ek race mein pad jaate the — user
  // ka gesture start hone se pehle hi agla forced-scroll usse "cancel" kar deta tha,
  // isliye upar scroll karna practically असंभव lagta tha. Fix: touchmove/wheel ka
  // pehla pixel milte hi (scrollTop badalne se bhi pehle) stickiness turant off kar do.
  function userInitiatedScroll() {
    if (stickToBottom) {
      stickToBottom = false;
      updateJumpBtn();
    }
  }
  $main.addEventListener('touchmove', userInitiatedScroll, { passive: true });
  $main.addEventListener('wheel', userInitiatedScroll, { passive: true });
  $main.addEventListener('touchstart', () => { touching = true; }, { passive: true });
  $main.addEventListener('touchend', () => { touching = false; }, { passive: true });
  $main.addEventListener('touchcancel', () => { touching = false; }, { passive: true });

  $jumpBtn.addEventListener('click', () => {
    stickToBottom = true;
    $main.scrollTo({ top: $main.scrollHeight, behavior: 'smooth' });
    updateJumpBtn();
  });

  function addUserBubble(text, filesMeta) {

      textEl.textContent = text;
      bubble.appendChild(textEl);

    row.appendChild(bubble);
    $main.appendChild(row);
    scrollBottom(true);
  }

  // Live web-search status row — backend jab bhi ek [ACTION:web_search] phase
  // stream karta hai ('searching' -> 'found'/'search_failed' -> 'answering'),
  // yahi row us waqt real-time mein update hoti hai.
  function addSearchStatus() {

    row.className = 'row assistant';
    row.innerHTML = `
      <div class="search-status">
