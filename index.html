  function updateSearchStatus(row, phase, query, count) {
    if (!row) return;
    const box = row.querySelector('.search-status');
    const glass = row.querySelector('.glass');
    const textEl = row.querySelector('.status-text');
    if (!box) return;

    if (phase === 'searching') {
      box.className = 'search-status';
      glass.innerHTML = '<img src="https://img.icons8.com/dotty/32/window-search.png" alt="search">';
      textEl.innerHTML = `"${escapeHtml(query || '')}" search kar raha hoon<span class="dots"></span>`;
    } else if (phase === 'found') {
      box.className = 'search-status found';
      glass.innerHTML = '<img src="https://img.icons8.com/led/32/ok.png" alt="done">';
      textEl.textContent = `${count} results mile — jawab bana raha hoon`;
    } else if (phase === 'search_failed') {
      box.className = 'search-status failed';
      glass.innerHTML = '<img src="https://img.icons8.com/led/32/box-important.png" alt="warning">';
      textEl.textContent = 'Live search fail ho gaya — apni knowledge se jawab de raha hoon';
    } else if (phase === 'answering') {
      box.className = 'search-status found';
      glass.innerHTML = '<img src="https://img.icons8.com/led/32/edit.png" alt="writing">';
      textEl.innerHTML = `Jawab likh raha hoon<span class="dots"></span>`;
    }
    scrollBottom();
  }

  // Live code-run status row — search-status jaisi hi CSS classes reuse karte
  // hain (bas emoji/text alag), taaki visually consistent lage.
  function addCodeStatus() {
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.innerHTML = `
      <div class="search-status">
        <span class="glass"><img src="https://img.icons8.com/wired/32/python.png" alt="python"></span>
        <span class="status-text"></span>
        <span class="scan-bar"></span>
      </div>`;
    $main.appendChild(row);
    scrollBottom();
    return row;
  }

  function updateCodeStatus(row, phase, detail) {
    if (!row) return;
    const box = row.querySelector('.search-status');
    const glass = row.querySelector('.glass');
    const textEl = row.querySelector('.status-text');
    if (!box) return;
    const d = detail ? escapeHtml(detail) : '';

    if (phase === 'running') {
      box.className = 'search-status';
      glass.innerHTML = '<img src="https://img.icons8.com/wired/32/python.png" alt="python">';
      textEl.innerHTML = `Python code sandbox mein chala raha hoon<span class="dots"></span>`;
    } else if (phase === 'reading') {
      box.className = 'search-status';
      glass.innerHTML = '<img src="https://img.icons8.com/led/32/insert-page.png" alt="reading">';
      textEl.innerHTML = `"${d}" padh raha hoon<span class="dots"></span>`;
    } else if (phase === 'writing') {
      box.className = 'search-status';
      glass.innerHTML = '<img src="https://img.icons8.com/led/32/edit.png" alt="writing">';
      textEl.innerHTML = `"${d}" likh raha hoon<span class="dots"></span>`;
    } else if (phase === 'installing') {
      box.className = 'search-status';
      glass.innerHTML = '<img src="https://img.icons8.com/led/32/automatic.png" alt="installing">';
      textEl.innerHTML = `"${d}" package install kar raha hoon<span class="dots"></span>`;
    } else if (phase === 'done') {
      box.className = 'search-status found';
      glass.innerHTML = '<img src="https://img.icons8.com/led/32/ok.png" alt="done">';
      textEl.textContent = 'Code chal gaya — jawab bana raha hoon';
    } else if (phase === 'failed') {
      box.className = 'search-status failed';
      glass.innerHTML = '<img src="https://img.icons8.com/led/32/box-important.png" alt="warning">';
      textEl.textContent = 'Code mein error aayi — model ko bata raha hoon';
    }
    scrollBottom();
  }

  // ── Python Sandbox (Vercel Sandbox — real server-side microVM) ─────────
  // Model jo bhi [ACTION:run_code] se code bhejta hai, wo /api/sandbox ko
  // POST kiya jaata hai, jahan wo ek naye, isolated Vercel Sandbox
  // (Firecracker microVM) mein chalta hai — server-side, poori file 
  // api/sandbox.js dekho.
  //
  // 2026-08-05: Pehle ye browser ke andar Pyodide (WASM) Web Worker mein
  // chalta tha. Wahan ek real bug tha — timeout hone par worker actually
  // kill nahi hota tha (sirf JS-side wait chhod dete the), aur worker ek
  // hi singleton instance ki tarah reuse hota tha. Matlab ek infinite loop
  // poore sandbox ko HAMESHA ke liye stuck kar deta tha (page refresh tak).
  // Ab har run apna khud ka fresh sandbox leta hai aur server khud usko
  // force-stop karta hai (timeout ho ya normal finish) — koi shared state
  // nahi bachta jo stuck ho sake. Bonus: real network (pip install kaam
  // karta hai ab) aur binary files bhi ab support ho sakti hain (abhi bhi
  // sirf text/utf8 return hoti hai, binary readback aage add kar sakte hain).
  //
  // Is conversation mein ab tak jitni bhi text/pdf files attach ki gayi hain,
  // unka content yahan filename -> content map mein rakhte hain — taaki
  // request ke saath "current files" bhej sake. Naya chat shuru hone ya
  // session switch hone par reset hota hai.
  let sandboxFiles = {};
  // Server ka apna 15s hard-timeout hai (api/sandbox.js); yahan thoda buffer
  // rakha hai taaki network latency ki wajah se time na khatam ho jaaye.
  const CODE_TIMEOUT_MS = 20000;

  // { ok, stdout, error?, outputFiles? } return karta hai. Kabhi reject nahi
  // hota — network fail/timeout bhi ek "ok:false" result ki tarah resolve
  // hota hai, taaki caller loop mein hamesha aage badh sake.
  // onProgress(phase, detail) — abhi sirf ek baar 'running' fire hota hai
  // (server se live phase-events abhi stream nahi hote — HTTP request/
  // response hai, Worker jaisi postMessage progress nahi). Future mein
  // /api/sandbox ko NDJSON stream banaya ja sakta hai agar live progress
  // wapas chahiye.
  async function runPythonSandboxed(code, onProgress) {
    if (typeof onProgress === 'function') onProgress('running', '');

    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), CODE_TIMEOUT_MS);
    try {
      const resp = await fetch('/api/sandbox', {
        method: 'POST',
        signal: ctrl.signal,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, inputFiles: sandboxFiles }),
      });
      clearTimeout(timer);

      let data;
      try {
        data = await resp.json();
      } catch (parseErr) {
        return { ok: false, stdout: '', error: `Sandbox se invalid response mila (HTTP ${resp.status})` };
      }
      if (!resp.ok && data.ok === undefined) {
        return { ok: false, stdout: '', error: data.error || `Sandbox HTTP ${resp.status}` };
      }
      return data;
    } catch (err) {
      clearTimeout(timer);
      const isAbort = err && err.name === 'AbortError';
      return {
        ok: false,
        stdout: '',
        error: isAbort
          ? `Timeout — code ${CODE_TIMEOUT_MS / 1000} second se zyada chal gaya, rok diya gaya.`
          : 'Sandbox request fail hui (network/server issue): ' + String((err && err.message) || err),
      };
    }
  }

  // Code-run result ko ek "user" turn ki tarah wapas model ko bhejne ke liye
  // format karta hai — web_search ke formatSearchResultsForModel jaisa hi pattern.
  function formatCodeResultForModel(code, result) {
    if (result.ok) {
      const out = (result.stdout || '').trim();
      const resultLine = result.result ? `\nReturn value: ${result.result}` : '';
      const modifiedFiles = (result.outputFiles || []).filter((f) => f.kind === 'modified');
      const newFiles = (result.outputFiles || []).filter((f) => f.kind !== 'modified');
      const fileBits = [];
      if (modifiedFiles.length) fileBits.push(`Modify hui files (existing attached file update hui): ${modifiedFiles.map(f => f.name).join(', ')}`);
      if (newFiles.length) fileBits.push(`Nayi (brand-new) files: ${newFiles.map(f => f.name).join(', ')}`);
      const filesLine = fileBits.length
        ? `\n${fileBits.join('\n')}\n(User ko ye files already download button ki tarah "Modified"/"New" card mein dikh rahi hain — tujhe sirf naam mention karna hai, content dobara mat likh.)`
        : `\nKOI FILE CREATE/SAVE NAHI HUI iss run mein. Agar user ne file maangi thi, to "file ban gayi"/"successfully create ho gayi"/"download button de diya" jaisa KABHI mat bol — saaf bata ki file nahi bani (code mein likhna reh gaya, ya path/filename galat tha, ya error aayi), aur agar zaroorat ho to sahi kiya hua code doosri baar bhej.`;
      return `[Python code run ho gaya, output:]\n${out || '(koi stdout output nahi tha)'}${resultLine}${filesLine}\n\n[Iske base pe user ko seedha, natural Hinglish jawab de.]`;
    }
    return `[Python code run karte waqt error aayi:]\n${result.error || 'Unknown error'}\n${result.stdout ? `\nAb tak ka stdout:\n${result.stdout}` : ''}\n\n[User ko chhote mein batao ki code mein kya galat hua, aur agar fix possible ho to sahi kiya hua code TURANT [ACTION:run_code] se dobara (khud) bhej de aur run kar — code ko sirf plain text/markdown mein "suggestion" ki tarah mat dikha, aur "batao to run kar dun?" jaisi permission bhi mat maang. [ACTION:run_code] khud-ba-khud chalta hai, isliye directly retry kar.]`;
  }

  // ── markdown renderer: headings, tables, lists, bold/italic/inline-code, fenced code blocks ──
  let cbCounter = 0;
  const codeStore = {}; // id -> {lang, code} (copy button ke liye, escaped HTML se alag rakha)

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // sirf inline patterns (bold/italic/inline-code) — block-level text ke andar use hota hai
  function inlineFormat(str) {
    let text = escapeHtml(str);
    text = text.replace(/`([^`\n]+)`/g, (_, c) => `<code class="inline-code">${c}</code>`);
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    text = text.replace(/_([^_\n]+)_/g, '<em>$1</em>');
    return text;
  }

  function isSeparatorRow(line) {
    return line != null && line.includes('-') && /^\s*\|?[\s:\-|]+\|?\s*$/.test(line);
  }

  function splitTableRow(line) {
    let l = line.trim();
    if (l.startsWith('|')) l = l.slice(1);
    if (l.endsWith('|')) l = l.slice(0, -1);
    return l.split('|').map(c => c.trim());
  }

  function tableHtml(headerCells, rows) {
    const thead = `<tr>${headerCells.map(c => `<th>${inlineFormat(c)}</th>`).join('')}</tr>`;
    const tbody = rows
      .map(r => `<tr>${r.map(c => `<td>${inlineFormat(c)}</td>`).join('')}</tr>`)
      .join('');
    return `<div class="md-table-wrap"><table class="md-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
  }

  const SHELL_LANGS = new Set(['bash', 'sh', 'shell', 'zsh', 'termux']);

  function codeBlockHtml(id) {
    const { lang, code } = codeStore[id];
    const isShell = SHELL_LANGS.has((lang || '').toLowerCase());

    const actionsHtml = isShell
      ? `<div class="codeblock-actions">
           <button type="button" class="copy-btn" onclick="copyCode('${id}')">Copy</button>
           <button type="button" class="run-btn" id="runbtn-${id}" onclick="runShellBlock('${id}')">▶ Run</button>
         </div>`
      : `<button type="button" class="copy-btn" onclick="copyCode('${id}')">Copy</button>`;

    const outputHtml = isShell
      ? `<div class="codeblock-output" id="out-${id}"><pre id="outpre-${id}"></pre><div class="exit-line" id="exitline-${id}"></div></div>
         <div class="codeblock-stdin" id="stdinrow-${id}" style="display:none;">
           <div class="stdin-wait-hint" id="stdinhint-${id}"></div>
           <div class="stdin-input-row">
             <input type="text" id="stdin-${id}" placeholder="Input bhejo…">
             <button type="button" onclick="sendShellStdin('${id}')">Send</button>
           </div>
         </div>`
      : '';

    return `<div class="codeblock" data-id="${id}">
      <div class="codeblock-head">
        <span class="lang">${escapeHtml(lang || 'text')}</span>
        ${actionsHtml}
      </div>
      <pre><code>${escapeHtml(code)}</code></pre>
      ${outputHtml}
    </div>`;
  }

  // ── LaTeX/KaTeX support ──
  // mathStore mein raw latex source rakhte hain, ussi tarah jaise codeStore
  // code rakhta hai — placeholder ek "invisible" marker hai jisme koi
  // HTML-special character (& < >) nahi hota, isliye woh inlineFormat ke
  // escapeHtml se safely guzar jaata hai aur baad me asli KaTeX HTML se
  // replace ho jaata hai.
  let mathCounter = 0;
  const mathStore = {};

  function stashMath(latex, displayMode) {
    const id = 'm' + (mathCounter++);
    mathStore[id] = { latex, displayMode };
    return `\u0002${id}\u0002`;
  }

  // Text ke andar se \[..\], \(..\), $$..$$ nikaal ke placeholder daal do.
  // Order zaroori hai: pehle block-level (\[..\] aur $$..$$), phir inline (\(..\)).
  function extractMath(text) {
    let out = text.replace(/\\\[([\s\S]+?)\\\]/g, (_, latex) => stashMath(latex, true));
    out = out.replace(/\$\$([\s\S]+?)\$\$/g, (_, latex) => stashMath(latex, true));
    out = out.replace(/\\\(([\s\S]+?)\\\)/g, (_, latex) => stashMath(latex, false));
    return out;
  }

  function renderMathHtml(id) {
    const entry = mathStore[id];
    if (!entry) return '';
    if (typeof katex === 'undefined') {
      // KaTeX load nahi hui (network issue) — raw latex hi dikha do taaki
      // kam se kam kuch dikhe, silently gayab na ho jaaye.
      const raw = escapeHtml(entry.displayMode ? `\\[${entry.latex}\\]` : `\\(${entry.latex}\\)`);
      return entry.displayMode ? `<div class="md-math-block">${raw}</div>` : `<span class="md-math-inline">${raw}</span>`;
    }
    try {
      const html = katex.renderToString(entry.latex, {
        throwOnError: false,
        displayMode: entry.displayMode,
        strict: false,
      });
      return entry.displayMode ? `<div class="md-math-block">${html}</div>` : `<span class="md-math-inline">${html}</span>`;
    } catch (err) {
      return `<span class="md-math-error">[LaTeX error]</span>`;
    }
  }

  function renderMarkdown(raw) {
    // step 0: LaTeX segments ko pehle nikaal lo (code blocks se bhi pehle,
    // taaki ```...``` ke andar ke \[ \] galti se match na ho jaayein — code
    // fences already literal backticks maangte hain jo alag hi handle hote
    // hain, is liye order safe hai).
    const withMathPlaceholders = extractMath(raw);

    // step 1: fenced code blocks nikaal ke placeholder line daal do (raw text par, escape se pehle)
    const withPlaceholders = withMathPlaceholders.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      const id = 'cb' + (cbCounter++);
      codeStore[id] = { lang: lang || '', code: code.replace(/\n$/, '') };
      return `\u0000${id}\u0000`;
    });

    const lines = withPlaceholders.split('\n');
    let html = '';
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      if (line.trim() === '') { i++; continue; }

      // fenced code placeholder
      if (/^\u0000cb\d+\u0000$/.test(line.trim())) {
        html += line.trim();
        i++;
        continue;
      }

      // heading
      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        const level = h[1].length;
        html += `<h${level} class="md-h">${inlineFormat(h[2])}</h${level}>`;
        i++;
        continue;
      }

      // table (current line has |, next line is the ---|--- separator)
      if (line.includes('|') && isSeparatorRow(lines[i + 1])) {
        const headerCells = splitTableRow(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim() !== '' && lines[i].includes('|')) {
          rows.push(splitTableRow(lines[i]));
          i++;
        }
        html += tableHtml(headerCells, rows);
        continue;
      }

      // unordered list
      if (/^\s*[-*]\s+/.test(line)) {
        let items = '';
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          items += `<li>${inlineFormat(lines[i].replace(/^\s*[-*]\s+/, ''))}</li>`;
          i++;
        }
        html += `<ul class="md-list">${items}</ul>`;
        continue;
      }

      // ordered list
      if (/^\s*\d+\.\s+/.test(line)) {
        let items = '';
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          items += `<li>${inlineFormat(lines[i].replace(/^\s*\d+\.\s+/, ''))}</li>`;
          i++;
        }
        html += `<ol class="md-list">${items}</ol>`;
        continue;
      }

      // paragraph: consecutive plain lines until something else starts
      const paraLines = [];
      while (
        i < lines.length &&
        lines[i].trim() !== '' &&
        !/^#{1,6}\s+/.test(lines[i]) &&
        !/^\s*[-*]\s+/.test(lines[i]) &&
        !/^\s*\d+\.\s+/.test(lines[i]) &&
        !/^\u0000cb\d+\u0000$/.test(lines[i].trim()) &&
        !(lines[i].includes('|') && isSeparatorRow(lines[i + 1]))
      ) {
        paraLines.push(lines[i]);
        i++;
      }
      if (paraLines.length === 1 && /^\u0002m\d+\u0002$/.test(paraLines[0].trim())) {
        // Sirf ek standalone block-math placeholder — <p> ke andar <div> daalna
        // invalid nesting hota, isliye seedha placeholder chhod do (step 3 mein
        // divi> ban jaayega).
        html += paraLines[0].trim();
      } else if (paraLines.length) {
        html += `<p class="md-p">${paraLines.map(inlineFormat).join('<br>')}</p>`;
      } else {
        i++; // safety net, avoid infinite loop
      }
    }

    // step 2: code block placeholders ko asli block se replace karo
    html = html.replace(/\u0000(cb\d+)\u0000/g, (_, id) => codeBlockHtml(id));

    // step 3: math placeholders ko asli KaTeX-rendered HTML se replace karo
    html = html.replace(/\u0002(m\d+)\u0002/g, (_, id) => renderMathHtml(id));

    return html;
  }

  window.copyCode = function (id) {
    const entry = codeStore[id];
    if (!entry) return;
    navigator.clipboard.writeText(entry.code).then(() => {
      const btn = document.querySelector(`.codeblock[data-id="${id}"] .copy-btn`);
      if (!btn) return;
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    });
  };

  // Shell codeblock ka "▶ Run" — Bridge se connect karke command chalata hai,
  // live stdout/stderr dikhata hai, aur khatam hone par poora result agla
  // "user" turn ki tarah AI ko wapas bhej deta hai (jaise ask_user ka jawab).
  window.runShellBlock = function (id) {
    const entry = codeStore[id];
    if (!entry) return;
    const runBtn = document.getElementById(`runbtn-${id}`);
    const outBox = document.getElementById(`out-${id}`);
    const outPre = document.getElementById(`outpre-${id}`);
    const exitLine = document.getElementById(`exitline-${id}`);
    const stdinRow = document.getElementById(`stdinrow-${id}`);
    const stdinHint = document.getElementById(`stdinhint-${id}`);
    if (!runBtn || !outBox) return;

    outBox.classList.add('show');
    outPre.textContent = '';
    exitLine.textContent = '';
    exitLine.className = 'exit-line';
    stdinRow.style.display = 'flex';
    stdinRow.classList.remove('waiting');
    if (stdinHint) { stdinHint.textContent = ''; stdinHint.classList.remove('show'); }
    runBtn.textContent = '⏹ Stop';
    runBtn.classList.add('running');
    runBtn.onclick = () => window.stopShellBlock(id);

    let fullOutput = '';

    Bridge.run(entry.code, {
      onOutput(stream, data) {
        fullOutput += data;
        outPre.textContent += data;
        outBox.scrollTop = outBox.scrollHeight;
      },
      onWaitingInput(waiting) {
        // Server ne /proc check karke bataya hai ki command sach mein
        // stdin ka wait kar rahi hai — sirf tabhi hint/highlight dikhao,
        // hamesha nahi (jaisa pehle hota tha).
        stdinRow.classList.toggle('waiting', waiting);
        if (stdinHint) {
          stdinHint.textContent = waiting ? '⌨ Command input maang rahi hai…' : '';
          stdinHint.classList.toggle('show', waiting);
        }
      },
      onExit(code) {
        runBtn.textContent = '▶ Run';
        runBtn.classList.remove('running');
        runBtn.onclick = () => window.runShellBlock(id);
        stdinRow.style.display = 'none';
        stdinRow.classList.remove('waiting');
        if (stdinHint) { stdinHint.textContent = ''; stdinHint.classList.remove('show'); }
        exitLine.innerHTML = code === 0
          ? '<img class="inline-icon" src="https://img.icons8.com/led/32/ok.png" alt="ok"> Exit code 0'
          : `<img class="inline-icon" src="https://img.icons8.com/led/32/close-window.png" alt="fail"> Exit code ${code}`;
        exitLine.className = 'exit-line ' + (code === 0 ? 'ok' : 'fail');
        scrollBottom();
        if (!busy) {
          send(formatTermuxResultForModel(entry.code, fullOutput, code), `Termux run (exit ${code})`, []);
        }
      },
      onError(message) {
        runBtn.textContent = '▶ Run';
        runBtn.classList.remove('running');
        runBtn.onclick = () => window.runShellBlock(id);
        stdinRow.style.display = 'none';
        stdinRow.classList.remove('waiting');
        if (stdinHint) { stdinHint.textContent = ''; stdinHint.classList.remove('show'); }
        exitLine.innerHTML = '<img class="inline-icon" src="https://img.icons8.com/led/32/close-window.png" alt="fail"> ' + escapeHtml(message);
        exitLine.className = 'exit-line fail';
        scrollBottom();
      },
    });
  };

  window.stopShellBlock = function (id) {
    Bridge.kill();
  };

  window.sendShellStdin = function (id) {
    const input = document.getElementById(`stdin-${id}`);
    const outPre = document.getElementById(`outpre-${id}`);
    if (!input || !input.value) return;
    Bridge.sendStdin(input.value);
    if (outPre) outPre.textContent += `> ${input.value}\n`;
    input.value = '';
  };

  // ── Sound FX (typing ticks) ──────────────────────────────────────────
  // Web Audio API se live synthesize kiya jaata hai — koi .mp3/.wav asset
  // load nahi karna padta, instant hai aur offline bhi chalega. Do alag
  // "premium tick" sounds: user ke type karne pe crisp/higher-pitch click,
  // AI ke jawab type-out hone pe softer/lower-pitch tick — taaki dono
  // clearly alag sunayi dein.
  const SoundFX = (() => {
    let ctx = null;
    let unlocked = false;

    function getCtx() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      return ctx;
    }

    // Mobile browsers AudioContext ko "suspended" state mein start karte
    // hain jab tak ek real user-gesture (touch/click/key) na aaye — pehle
    // gesture pe hi resume kar dete hain, taaki baad mein sound chalne mein
    // koi delay/silent-fail na ho.
    function unlock() {
      if (unlocked) return;
      const c = getCtx();
      if (!c) return;
      if (c.state === 'suspended') c.resume().catch(() => {});
      unlocked = true;
    }
    ['pointerdown', 'keydown'].forEach((ev) =>
      document.addEventListener(ev, unlock, { once: true, passive: true })
    );

    // Ek chhota synthesized click/tick. freq/duration/gain/type badalke
    // alag character wale sounds ban jaate hain.
    function playTick({ freq, duration, gain, type }) {
      const c = getCtx();
      if (!c || c.state !== 'running') return;

      const osc = c.createOscillator();
      const amp = c.createGain();
      osc.type = type;
      // Har tick pe thoda pitch-jitter — robotic/repetitive na lage,
      // ek natural "premium keyboard" feel ke liye (jaise iOS clicks).
      const jitter = 1 + (Math.random() - 0.5) * 0.06;
      osc.frequency.setValueAtTime(freq * jitter, c.currentTime);

      amp.gain.setValueAtTime(gain, c.currentTime);
      amp.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + duration);

      osc.connect(amp).connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + duration);
    }

    let lastUserTick = 0;
    function userTick() {
      // Fast typing ya paste pe flood na ho, isliye min-gap.
      const now = performance.now();
      if (now - lastUserTick < 35) return;
      lastUserTick = now;
      playTick({ freq: 1500, duration: 0.035, gain: 0.05, type: 'square' });
    }

    function aiTick() {
      playTick({ freq: 720, duration: 0.05, gain: 0.045, type: 'sine' });
    }

    return { userTick, aiTick };
  })();

  // Bubble already has final rendered HTML (tags intact) — hum sirf text nodes ko
  // khaali karke, order mein thoda-thoda reveal karte hain. Isse tags kabhi beech
  // mein toot-te nahi (jaise markdown ka `**` ya code block).
  function typewriterReveal(bubble, onDone) {
    const walker = document.createTreeWalker(bubble, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) {
      nodes.push({ node: n, full: n.textContent });
      n.textContent = '';
    }
    if (!nodes.length) { if (onDone) onDone(); return; }

    bubble.classList.add('typing');
    const CHARS_PER_TICK = 3;
    const TICK_MS = 22; // pehle 2 chars/14ms tha (~72 DOM writes/sec) — mobile pe scroll ke saath
                         // reflow contention karta tha. Ab ~3 chars/22ms (~45/sec), roughly same speed.
    let ni = 0, ci = 0, soundStep = 0;

    function step() {
      if (ni >= nodes.length) {
        bubble.classList.remove('typing');
        if (onDone) onDone();
        return;
      }
      const entry = nodes[ni];
      ci += CHARS_PER_TICK;
      if (ci >= entry.full.length) {
        entry.node.textContent = entry.full;
        ni++;
        ci = 0;
      } else {
        entry.node.textContent = entry.full.slice(0, ci);
      }
      // Har DOM-tick pe sound bajaayenge to ~45/sec ki buzz ban jaayegi —
      // isliye har 3rd tick pe hi (~15/sec, ek natural tick-tick rhythm).
      soundStep++;
      if (soundStep % 3 === 0) SoundFX.aiTick();
      scrollBottom();
      setTimeout(step, TICK_MS);
    }
    step();
  }

  // ── Action Registry (frontend) ─────────────────────────────────────
  // Backend jab bhi [ACTION:name]{...} bhejta hai, uska matching handler yahan
  // se milta hai. Naya action-type add karna ho toh bas ek naya key daal do.
  const ACTION_HANDLERS = {
    ask_user: renderAskUser,
    termux_run: renderTermuxRun,
    quran_quiz_start: renderQuranQuizStart,
  };

  function renderAction(action, wrap) {
    if (!action || !action.name) return;
    const handler = ACTION_HANDLERS[action.name];
    if (handler) handler(action.payload || {}, wrap);
  }

  // File-type se icon-category aur short label decide karta hai — sirf visual
  // grouping ke liye hai, download logic pe koi asar nahi.
  const FILE_TYPE_MAP = {
    py: 'code', js: 'code', ts: 'code', jsx: 'code', html: 'code', css: 'code', sh: 'code', json: 'code',
    csv: 'data', tsv: 'data', xlsx: 'data', xls: 'data',
    txt: 'doc', md: 'doc', pdf: 'doc', docx: 'doc',
  };
  // TODO(icon-rule): ye custom hand-coded SVG hai, icons8 se nahi — poori app
  // LED style follow karti hai, isliye chaaho to isko bhi
  // https://img.icons8.com/led/{size}/insert-page.png jaisa LED <img> se
  // replace kar sakte ho consistency ke liye. Abhi functionally sahi hai,
  // sirf visual-consistency ka open item hai.
  function fileIconSvg() {
    // Generic document icon — rang category ke hisaab se CSS class decide karta hai.
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
  }
  function downloadIconSvg() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';
  }
  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  // Python sandbox run ke dauraan jo bhi nayi files current directory mein
  // ban gayi thin, unhe yahan Claude-style file cards ki tarah dikhate hain —
  // icon + naam + size, poora card tap karne pe seedha Blob se browser
  // download trigger ho jaata hai, koi server round-trip nahi (file already
  // client ke paas hai).
  function renderOutputFiles(files, wrap) {
    const box = document.createElement('div');
    box.className = 'output-files';
    for (const f of files) {
      const ext = (f.name.split('.').pop() || '').toLowerCase();
      const category = FILE_TYPE_MAP[ext] || 'other';
      const bytes = new TextEncoder().encode(f.content || '').length;

      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'output-file-card';

      const icon = document.createElement('div');
      icon.className = `output-file-icon ${category}`;
      icon.innerHTML = fileIconSvg();

      const meta = document.createElement('div');
      meta.className = 'output-file-meta';
      const nameEl = document.createElement('div');
      nameEl.className = 'output-file-name';
      nameEl.textContent = f.name;
      const subEl = document.createElement('div');
      subEl.className = 'output-file-sub';
      subEl.textContent = `${ext ? ext.toUpperCase() + ' · ' : ''}${formatFileSize(bytes)}`;
      meta.append(nameEl, subEl);

      const kind = f.kind === 'modified' ? 'modified' : 'new';
      const badge = document.createElement('div');
      badge.className = `output-file-badge ${kind}`;
      badge.textContent = kind === 'modified' ? 'Modified' : 'New';

      const dl = document.createElement('div');
      dl.className = 'output-file-download';
      dl.innerHTML = downloadIconSvg();

      card.append(icon, meta, badge, dl);
      card.addEventListener('click', () => {
        const blob = new Blob([f.content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = f.name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      });
      box.appendChild(card);
    }
    wrap.appendChild(box);
    scrollBottom();
  }

  // ── Quran Quiz — [ACTION:quran_quiz_start]{"from":1,"to":30} ───────────
  // Bilkul run_code jaisa "client-side resolved" action hai — server ko
  // ayat data ki zaroorat hi nahi, sab kuch yahin browser mein ho jaata hai.
  // quran_full.json ek baar fetch/cache ho jaata hai (~2.2MB), phir sirf
  // in-memory se filter+random-pick hota hai, koi dubara network call nahi.
  let quranData = null;
  let quranDataPromise = null;
  // Ek quiz session (from/to/total/answered/correct) — jab tak "total" sawaal
  // poore nahi ho jaate, agle har [ACTION:quran_quiz_start] pe isi session ko
  // continue kiya jaata hai. Session khatam hote hi wapas null ho jaata hai,
  // taaki agli baar "quiz khelna hai" bolne pe fresh session bane.
  let activeQuiz = null;

  function loadQuranData() {
    if (!quranDataPromise) {
      quranDataPromise = fetch('quran_full.json')
        .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then((data) => { quranData = data; return data; });
    }
    return quranDataPromise;
  }

  function pickRandomAyat(from, to) {
    const pool = quranData.filter((a) => a.para >= from && a.para <= to);
    if (!pool.length) return null;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // Quiz ka poora result — kaunsi ayat dikhi, sahi jawab kya tha, user ne
  // kya diya, sahi/galat, aur session progress — yahi ek "user" turn ki
  // tarah model ko wapas jaata hai (bilkul formatCodeResultForModel jaisa),
  // taaki model kabhi kisi bhi cheez se "blind" na rahe, chahe UI mein card
  // khud dikh raha ho, aur usko pata rahe kab session khatam ho gaya.
  function formatQuizResultForModel(verse, userPara, userPip, isCorrect, session) {
    const progressLine = `Sawaal ${session.answered}/${session.total} · Ab tak sahi: ${session.correct}/${session.answered}`;
    const isLast = session.answered >= session.total;
    return `[Quran Quiz card ka result:]\n`
      + `Dikhayi gayi ayat: "${verse.text}"\n`
      + `Sahi jawab — Surah: ${verse.surah_name}, Para: ${verse.para}, Page: ${verse.pip} (Absolute Quran Page: ${verse.page})\n`
      + `User ka jawab — Para: ${userPara}, Page: ${userPip}\n`
      + `Result: ${isCorrect ? 'SAHI ✅' : 'GALAT ❌'}\n`
      + `${progressLine}\n`
      + (isLast
        ? `QUIZ SESSION KHATAM — ye is session ka aakhri sawaal tha.\n\n[Ab koi naya [ACTION:quran_quiz_start] mat bhej. Ek chhota final summary de (${session.correct}/${session.total} sahi) aur poochh naya session (naya range/count) khelna hai kya.]`
        : `\n[Isi ke base pe turant ek short Hinglish reaction de — sahi tha to tareef kar, galat tha to sahi Surah/Para/Page bata ke halka encourage kar. Fir BINA poochhe seedha agla [ACTION:quran_quiz_start] bhej de usi from/to/total ke saath — session abhi khatam nahi hua.]`);
  }

  function renderQuranQuizStart(payload, wrap) {
    let from = parseInt(payload && payload.from, 10);
    let to = parseInt(payload && payload.to, 10);
    let total = parseInt(payload && payload.total, 10);
    if (!Number.isFinite(from)) from = 1;
    if (!Number.isFinite(to)) to = 30;
    from = Math.min(Math.max(from, 1), 30);
    to = Math.min(Math.max(to, 1), 30);
    if (from > to) { const t = from; from = to; to = t; }
    if (!Number.isFinite(total) || total < 1) total = 10;

    // Naya session sirf tabhi banao jab koi active session chal hi na raha ho
    // (pehla sawaal). Baaki sab sawaalon ke liye wahi session object reuse
    // hota hai, taaki progress/score sahi se accumulate ho.
    if (!activeQuiz) {
      activeQuiz = { from, to, total, answered: 0, correct: 0 };
    }
    const session = activeQuiz;

    const card = document.createElement('div');
    card.className = 'quiz-card';
    const eyebrow = document.createElement('div');
    eyebrow.className = 'quiz-card-eyebrow';
    eyebrow.innerHTML = `<img class="inline-icon" src="https://img.icons8.com/led/32/goal.png" alt="quiz"> Quiz · Para ${session.from}–${session.to} · Sawaal ${session.answered + 1}/${session.total}`;
    card.appendChild(eyebrow);

    const loading = document.createElement('div');
    loading.className = 'quiz-card-loading';
    loading.textContent = 'Ayat load ho rahi hai…';
    card.appendChild(loading);

    wrap.appendChild(card);
    scrollBottom();

    loadQuranData()
      .then(() => {
        const verse = pickRandomAyat(session.from, session.to);
        loading.remove();
        if (!verse) {
          const err = document.createElement('div');
          err.className = 'quiz-error';
          err.textContent = 'Is para range mein koi ayat nahi mili.';
          card.appendChild(err);
          scrollBottom();
          return;
        }
        buildQuizCardBody(card, verse, session);
      })
      .catch(() => {
        loading.textContent = 'Ayat data load nahi ho saka — dobara try karo.';
      });
  }

  function buildQuizCardBody(card, verse, session) {
    const ayat = document.createElement('div');
    ayat.className = 'quiz-ayat';
    ayat.textContent = verse.text;
    card.appendChild(ayat);

    const inputsRow = document.createElement('div');
    inputsRow.className = 'quiz-inputs-row';

    const paraField = document.createElement('div');
    paraField.className = 'quiz-field';
    const paraLabel = document.createElement('label');
    paraLabel.textContent = 'Para';
    const paraInput = document.createElement('input');
    paraInput.type = 'number';
    paraInput.min = '1';
    paraInput.max = '30';
    paraInput.placeholder = 'e.g. 3';
    paraField.append(paraLabel, paraInput);

    const pageField = document.createElement('div');
    pageField.className = 'quiz-field';
    const pageLabel = document.createElement('label');
    pageLabel.textContent = 'Page';
    const pageInput = document.createElement('input');
    pageInput.type = 'number';
    pageInput.min = '1';
    pageInput.max = '25';
    pageInput.placeholder = 'e.g. 12';
    pageField.append(pageLabel, pageInput);

    inputsRow.append(paraField, pageField);
    card.appendChild(inputsRow);

    const submitBtn = document.createElement('button');
    submitBtn.type = 'button';
    submitBtn.className = 'quiz-submit-btn';
    submitBtn.textContent = 'Jawab Bhejein';
    card.appendChild(submitBtn);

    const errBox = document.createElement('div');
    errBox.className = 'quiz-error';
    errBox.style.display = 'none';
    card.appendChild(errBox);

    submitBtn.addEventListener('click', () => {
      const userPara = parseInt(paraInput.value, 10);
      const userPip = parseInt(pageInput.value, 10);
      if (!Number.isFinite(userPara) || !Number.isFinite(userPip)) {
        errBox.textContent = 'Dono fields bharo — Para aur Page.';
        errBox.style.display = 'block';
        return;
      }
      errBox.style.display = 'none';

      const isCorrect = userPara === verse.para && userPip === verse.pip;

      paraInput.disabled = true;
      pageInput.disabled = true;
      submitBtn.disabled = true;

      session.answered++;
      if (isCorrect) session.correct++;

      const feedback = document.createElement('div');
      feedback.className = 'quiz-feedback ' + (isCorrect ? 'correct' : 'wrong');
      feedback.innerHTML = isCorrect
        ? `<img class="inline-icon" src="https://img.icons8.com/led/32/ok.png" alt="sahi"> Sahi jawab! Surah ${escapeHtml(verse.surah_name)}, Para ${verse.para}, Page ${verse.pip}. (${session.correct}/${session.answered})`
        : `<img class="inline-icon" src="https://img.icons8.com/led/32/close-window.png" alt="galat"> Galat. Sahi jawab tha — Surah ${escapeHtml(verse.surah_name)}, Para ${verse.para}, Page ${verse.pip}. (${session.correct}/${session.answered})`;
      card.appendChild(feedback);
      scrollBottom();

      const hiddenNote = formatQuizResultForModel(verse, userPara, userPip, isCorrect, session);
      const displayLabel = `🎯 Para ${userPara}, Page ${userPip}`;

      // Session poora ho gaya ho to agla card banne se pehle hi reset kar do,
      // taaki agli baar "quiz khelna hai" bolne pe naya session shuru ho.
      if (session.answered >= session.total) activeQuiz = null;

      if (!busy) send(hiddenNote, displayLabel);
    });

    scrollBottom();
  }

  // [ACTION:termux_run]{"command":"..."} ke liye — bilkul same codeblock UI
  // reuse karta hai jo ```bash fenced blocks ke liye already bani hai (Run/Stop/
  // stdin sab wahi), taaki AI structured action se bheje ya plain code-fence
  // se, user ko ek hi consistent widget dikhe.
  function renderTermuxRun(payload, wrap) {
    const command = payload && payload.command;
    if (typeof command !== 'string' || !command.trim()) return;
    const id = 'cb' + (cbCounter++);
    codeStore[id] = { lang: 'bash', code: command.trim() };
    const holder = document.createElement('div');
    holder.innerHTML = codeBlockHtml(id);
    wrap.appendChild(holder.firstElementChild);
    scrollBottom();
  }

  function renderAskUser(payload, wrap) {
    const { type, question, options } = payload;
    if (!question || !Array.isArray(options) || !options.length) return;

    const opts = options.slice(0, 4);
    const isMulti = type === 'multi';

    const backdrop = document.createElement('div');
    backdrop.className = 'ask-user-backdrop';

    const sheet = document.createElement('div');
    sheet.className = 'ask-user-sheet';

    const handle = document.createElement('div');
    handle.className = 'ask-user-sheet-handle';
    sheet.appendChild(handle);

    const q = document.createElement('div');
    q.className = 'ask-user-sheet-q';
    q.textContent = question;
    sheet.appendChild(q);

    const optsWrap = document.createElement('div');
    optsWrap.className = 'ask-user-sheet-opts';
    sheet.appendChild(optsWrap);

    // Sheet ko hata dete hain aur uski jagah chat ke andar ek chhota
    // "aapka jawab" summary chhod dete hain — taaki scroll-back pe context
    // dikhta rahe (jaise Claude ke apne ask_user widget mein hota hai).
    function close() {
      backdrop.classList.remove('show');
      sheet.classList.remove('show');
      setTimeout(() => {
        backdrop.remove();
        sheet.remove();
      }, 250);
    }

    function markAnswered(text) {
      const done = document.createElement('div');
      done.className = 'ask-user-answered';
      const b = document.createElement('b');
      b.textContent = text;
      done.append('Jawab: ', b);
      wrap.appendChild(done);
      scrollBottom();
    }

    if (isMulti) {
      const selected = new Set();
      const confirmBtn = document.createElement('button');
      confirmBtn.type = 'button';
      confirmBtn.className = 'ask-user-sheet-confirm';
      confirmBtn.textContent = 'Confirm';
      confirmBtn.disabled = true;

      opts.forEach((opt) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ask-user-sheet-opt';
        const label = document.createElement('span');
        label.textContent = opt;
        const chk = document.createElement('span');
        chk.className = 'chk sq';
        btn.append(chk, label);
        btn.addEventListener('click', () => {
          if (selected.has(opt)) {
            selected.delete(opt);
            btn.classList.remove('selected');
          } else {
            selected.add(opt);
            btn.classList.add('selected');
          }
          confirmBtn.disabled = selected.size === 0;
        });
        optsWrap.appendChild(btn);
      });

      confirmBtn.addEventListener('click', () => {
        const answer = Array.from(selected).join(', ');
        close();
        if (answer) {
          markAnswered(answer);
          if (!busy) send(answer);
        }
      });
      sheet.appendChild(confirmBtn);
    } else {
      opts.forEach((opt) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ask-user-sheet-opt';
        const label = document.createElement('span');
        label.textContent = opt;
        const chk = document.createElement('span');
        chk.className = 'chk';
        btn.append(chk, label);
        btn.addEventListener('click', () => {
          close();
          markAnswered(opt);
          if (!busy) send(opt);
        });
        optsWrap.appendChild(btn);
      });
    }

    // ── "Ya apna jawab likho" — diye gaye options tak limited nahi rehna
    // chahiye, user apna khud ka jawab type karke bhi bhej sake. Single aur
    // multi dono modes mein same row kaam karta hai — jo bhi custom text ho,
    // wahi seedha final jawab ban jaata hai (checkbox selection ignore ho
    // jaati hai agar user ne custom text bhi type kar diya ho).
    const customRow = document.createElement('div');
    customRow.className = 'ask-user-sheet-custom';
    const customInput = document.createElement('input');
    customInput.type = 'text';
    customInput.placeholder = 'Ya apna jawab likho…';
    const customBtn = document.createElement('button');
    customBtn.type = 'button';
    customBtn.textContent = 'Bhej';
    customRow.append(customInput, customBtn);
    sheet.appendChild(customRow);

    function submitCustom() {
      const answer = customInput.value.trim();
      if (!answer) return;
      close();
      markAnswered(answer);
      if (!busy) send(answer);
    }
    customBtn.addEventListener('click', submitCustom);
    customInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitCustom();
    });

    document.body.appendChild(backdrop);
    document.body.appendChild(sheet);
    // Ek frame chhod ke class add karo, taaki transform:translateY(100%) → 0
    // ka transition trigger ho (same-frame class add pe browser transition skip
    // kar sakta hai).
    requestAnimationFrame(() => {
      backdrop.classList.add('show');
      sheet.classList.add('show');
    });
    scrollBottom();
  }

  // ── "Termux connect karo" quick action ─────────────────────────────
  // Ye deterministic, client-side hi handle hota hai — AI model ko call
  // karne ki zaroorat nahi, kyunki jawab (connect button ya setup guide)
  // hamesha same hona chahiye aur localStorage se pakka pata chal sakta
  // hai ki user pehli baar hai ya returning. Isse model kabhi is baare
  // mein galat/inconsistent guide bhi nahi bana sakta.
  function isTermuxConnectIntent(text) {
    const t = (text || '').toLowerCase();
    const mentionsBridge = /\btermux\b|\bbridge\b/.test(t);
    const mentionsConnect = /connect|jod\s*do|jodo|judai|jorho|setup/.test(t);
    return mentionsBridge && mentionsConnect;
  }

  const TERMUX_SETUP_GUIDE_MD =
`Chalo Termux Bridge connect karte hain — pehle Termux app mein ye steps karo:

1. \`pkg install nodejs -y\`
2. \`mkdir -p ~/chaman-bridge && cd ~/chaman-bridge\`
3. \`server.js\` aur \`package.json\` files isi folder mein daal do
4. \`npm install\`
5. \`npm start\` — pehli baar ek TOKEN print hoga, usko copy kar lo
6. Neeche button dabaao aur wahi Port/Token paste karke "Save & Connect" dabao
7. Browser ka "local network access" permission popup allow karna zaroori hai
8. Termux band/restart hone ke baad dobara \`cd ~/chaman-bridge && npm start\` chalana padega`;

  function addBridgeConnectCard(isReturningUser) {
    const emptyEl = $main.querySelector('.empty');
    if (emptyEl) emptyEl.remove();

    const row = document.createElement('div');
    row.className = 'row assistant';
    const wrap = document.createElement('div');
    wrap.className = 'wrap';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderMarkdown(
      isReturningUser
        ? 'Termux Bridge pehle se set up hai — bas connect karna hai.'
        : TERMUX_SETUP_GUIDE_MD
    );
    wrap.appendChild(bubble);

    // Fixed restart command — user ko khud apne Termux app mein paste karke
    // chalana hai (bridge se "▶ Run" se nahi chala sakte, kyunki abhi bridge
    // server khud hi band hai — usko start karne ke liye hi ye command hai).
    // Isliye lang ko SHELL_LANGS se bahar rakha hai, taaki sirf Copy button
    // aaye, koi Run/stdin UI nahi.
    const cmdId = 'cb' + (cbCounter++);
    codeStore[cmdId] = { lang: 'text', code: 'cd chaman-bridge && npm start' };
    const cmdWrap = document.createElement('div');
    cmdWrap.innerHTML = codeBlockHtml(cmdId);
    wrap.appendChild(cmdWrap.firstElementChild);

    const actionsRow = document.createElement('div');
    actionsRow.className = 'bridge-inline-actions';
    const connectBtn = document.createElement('button');
    connectBtn.type = 'button';
    connectBtn.className = 'bridge-inline-connect-btn';
    connectBtn.innerHTML = isReturningUser
      ? '<img class="inline-icon" src="https://img.icons8.com/led/32/share-2.png" alt="connect"> Connect'
      : '<img class="inline-icon" src="https://img.icons8.com/led/32/share-2.png" alt="connect"> Setup karke Connect karo';
    // Same settings modal reuse karte hain (Save & Connect wahi hai) —
    // returning user ke liye pehle se token/port bhara hua milega.
    connectBtn.addEventListener('click', () => showBridgeSettingsModal());
    actionsRow.appendChild(connectBtn);
    wrap.appendChild(actionsRow);

    row.appendChild(wrap);
    $main.appendChild(row);
    scrollBottom(true);
  }

  function addAssistantBubble(text, meta, isError, animate, action, outputFiles) {
    // Backend action-parse fail ho jaaye aur text bhi khaali ho, to poori
    // bubble blank na dikhe (jaisa pehle "Groq · model" + Copy button ke
    // saath khaali box dikhta tha) — ek chhota fallback line de do.
    if (!isError && !action && (!text || !text.trim())) {
      text = 'Kuch gadbad ho gayi jawab render karte waqt — dobara try kar.';
    }
    const row = document.createElement('div');
    row.className = 'row assistant';
    const wrap = document.createElement('div');
    wrap.className = 'wrap';
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (isError ? ' err' : '');
    if (isError) {
      bubble.textContent = text;
    } else {
      bubble.innerHTML = renderMarkdown(text);
    }
    wrap.appendChild(bubble);
    row.appendChild(wrap);
    $main.appendChild(row);

    function attachMeta() {
      const footer = document.createElement('div');
      footer.className = 'msg-footer';

      if (meta) {
        const metaEl = document.createElement('span');
        metaEl.className = 'meta';
        metaEl.textContent = meta;
        footer.appendChild(metaEl);
      }

      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'msg-copy-btn';
      copyBtn.textContent = '⧉ Copy';
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.innerHTML = '<img class="inline-icon" src="https://img.icons8.com/led/32/ok.png" alt="copied"> Copied';
          copyBtn.classList.add('copied');
          setTimeout(() => {
            copyBtn.textContent = '⧉ Copy';
            copyBtn.classList.remove('copied');
          }, 1500);
        }).catch(() => {
          copyBtn.textContent = 'Copy fail hua';
          setTimeout(() => { copyBtn.textContent = '⧉ Copy'; }, 1500);
        });
      });
      footer.appendChild(copyBtn);

      wrap.appendChild(footer);
      if (action) renderAction(action, wrap);
      if (outputFiles && outputFiles.length) renderOutputFiles(outputFiles, wrap);
      scrollBottom();
    }

    if (!isError && animate) {
      // meta (provider · model) sirf typing khatam hone ke baad dikhta hai
      typewriterReveal(bubble, attachMeta);
    } else {
      attachMeta();
    }
    scrollBottom();
  }

  function lightDot(providerName) {
    $dots.forEach(d => d.classList.toggle('live', d.dataset.provider === providerName));
  }

  // Ek single /api/chat round-trip: request bhejta hai, NDJSON stream padhta
  // hai (live web_search status animate karte hue), aur { finalEvent, errorEvent }
  // return karta hai. thinkingRow already-mounted honi chahiye (caller banata hai).
  async function fetchExchange(apiMessages, thinkingRow) {
    let searchRow = null; // pehli 'status' event aane pe hi banti hai
    const controller = new AbortController();
    currentAbortController = controller;
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: apiMessages, termuxStatus: Bridge.status }),
        signal: controller.signal,
      });

      let finalEvent = null;
      let errorEvent = null;

      if (res.body && res.body.getReader) {
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          let nlIndex;
          while ((nlIndex = buffer.indexOf('\n')) !== -1) {
            const line = buffer.slice(0, nlIndex).trim();
            buffer = buffer.slice(nlIndex + 1);
            if (!line) continue;

            let event;
            try { event = JSON.parse(line); } catch { continue; }

            if (event.type === 'status') {
              if (!searchRow) {
                thinkingRow.remove();
                searchRow = addSearchStatus();
              }
              updateSearchStatus(searchRow, event.phase, event.query, event.count);
            } else if (event.type === 'final') {
              finalEvent = event;
            } else if (event.type === 'error') {
              errorEvent = event;
            }
          }
        }
      } else {
        // Fallback: streaming reader available nahi hai (bahut purana browser) —
        // seedha JSON ki tarah parse karo (naya backend NDJSON bhejta hai, isliye
        // ye path sirf ek safety net hai).
        const raw = await res.text();
        for (const line of raw.split('\n')) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          try {
            const event = JSON.parse(trimmed);
            if (event.type === 'final') finalEvent = event;
            else if (event.type === 'error') errorEvent = event;
          } catch { /* ignore malformed line */ }
        }
      }

      if (searchRow) searchRow.remove();
      return { finalEvent, errorEvent };
    } catch (err) {
      if (searchRow) searchRow.remove();
      // User ne khud Stop dabaya — ye ek real error nahi hai, isliye alag se
      // flag karte hain taaki caller koi error-bubble na dikhaye, chup-chaap ruk jaaye.
      if (err && err.name === 'AbortError') {
        return { finalEvent: null, errorEvent: null, aborted: true };
      }
      return { finalEvent: null, errorEvent: { error: 'Network error — connection check kar.' } };
    } finally {
      if (currentAbortController === controller) currentAbortController = null;
    }
  }

  // Agar model ne [ACTION:run_code] maanga hai, to (web_search ki tarah, bas
  // client-side) khud iss loop mein hi resolve kar dete hain: code Pyodide
  // sandbox mein chalao, result ko agla "user" turn bana ke wapas model ko
  // bhej do, jab tak wo final (non-run_code) jawab na de de ya max iterations
  // khatam na ho jaayein.
  const MAX_CODE_ITERATIONS = 3;

  async function send(text, displayText, filesMeta) {
    displayText = displayText != null ? displayText : text;
    filesMeta = filesMeta || [];
    history.push({ role: 'user', content: text, displayText, files: filesMeta });
    addUserBubble(displayText, filesMeta);
    $input.value = '';
    $input.style.height = 'auto';

    busy = true;
    setSendButtonBusy(true);

    try {
      let iter = 0;
      const producedFiles = []; // is turn ke saare run_code iterations mein bani output files ka collection
      let turnTokens = 0; // is poore turn (saare run_code round-trips samet) ka cumulative token cost

      while (true) {
        const thinkingRow = addThinking();
        const { finalEvent, errorEvent, aborted } = await fetchExchange(
          history.map(m => ({ role: m.role, content: m.content })),
          thinkingRow
        );
        thinkingRow.remove();

        if (aborted) {
          // User ne khud Stop dabaya — koi error bubble nahi, bas chup-chaap
          // ruk jao. Is turn ka partial history (agar koi ho) already push
          // nahi hua tha, isliye state consistent rehta hai.
          return;
        }

        if (errorEvent) {
          lightDot(null);
          let errText = errorEvent.error || 'Kuch gadbad ho gayi.';
          if (Array.isArray(errorEvent.details) && errorEvent.details.length) {
            errText += '\n\n— Details —\n' + errorEvent.details.join('\n');
          }
          addAssistantBubble(errText, null, true);
          return;
        }
        if (!finalEvent) {
          addAssistantBubble('Kuch gadbad ho gayi — response incomplete tha.', null, true);
          return;
        }

        // Har round-trip ka token cost real hai (chahe ye final answer ho ya
        // ek intermediate run_code iteration) — isliye har baar jodte hain,
        // sirf aakhri wale ka nahi.
        if (finalEvent.usage && typeof finalEvent.usage.total === 'number') {
          turnTokens += finalEvent.usage.total;
          sessionTokenTotal += finalEvent.usage.total;
          updateTokenBadge(finalEvent.usage.total);
        }

        if (finalEvent.action && finalEvent.action.name === 'run_code' && iter < MAX_CODE_ITERATIONS) {
          iter++;
          const code = finalEvent.action.payload && finalEvent.action.payload.code;
          if (typeof code !== 'string' || !code.trim()) {
            // Malformed request — jo bhi text mila usi ko final maan lo.
            history.push({
              role: 'assistant',
              content: finalEvent.reply,
              provider: finalEvent.provider,
              model: finalEvent.model,
              tokens: turnTokens ? { total: turnTokens } : undefined,
            });
            persistTurn();
            lightDot(finalEvent.provider);
            addAssistantBubble(
              finalEvent.reply,
              `${finalEvent.provider} · ${finalEvent.model || ''}${turnTokens ? ' · ' + formatTokenCount(turnTokens) + ' tok' : ''}`,
              false, true, null, producedFiles
            );
            return;
          }

          const codeRow = addCodeStatus();
          updateCodeStatus(codeRow, 'running');
          const result = await runPythonSandboxed(code, (phase, detail) => {
            updateCodeStatus(codeRow, phase, detail);
          });
          updateCodeStatus(codeRow, result.ok ? 'done' : 'failed');
          setTimeout(() => codeRow.remove(), 700);

          // Nayi bani files ko sandboxFiles mein bhi merge karo (taaki agla
          // iteration/run inhe bhi "existing file" ki tarah dekh sake) aur
          // final turn pe download-chips ke liye collect kar lo.
          if (Array.isArray(result.outputFiles)) {
            for (const f of result.outputFiles) {
              sandboxFiles[f.name] = f.content;
              const existingIdx = producedFiles.findIndex((p) => p.name === f.name);
              if (existingIdx !== -1) producedFiles.splice(existingIdx, 1);
              producedFiles.push(f);
            }
          }

          // Model ka action-call assistant turn ban jaata hai, aur code ka
          // result agle "user" turn ki tarah feed hota hai.
          history.push({ role: 'assistant', content: finalEvent.reply });
          history.push({ role: 'user', content: formatCodeResultForModel(code, result) });
          continue;
        }

        // run_code nahi maanga gaya (ya iterations khatam) — ye final answer hai.
        history.push({
          role: 'assistant',
          content: finalEvent.reply,
          provider: finalEvent.provider,
          model: finalEvent.model,
          tokens: turnTokens ? { total: turnTokens } : undefined,
        });
        persistTurn(); // pehla successful reply aate hi session (agar naya hai) auto-ban jaata hai
        lightDot(finalEvent.provider);
        addAssistantBubble(
          finalEvent.reply,
          `${finalEvent.provider} · ${finalEvent.model || ''}${turnTokens ? ' · ' + formatTokenCount(turnTokens) + ' tok' : ''}`,
          false, true, finalEvent.action, producedFiles
        );
        return;
      }
    } finally {
      busy = false;
      setSendButtonBusy(false);
      currentAbortController = null;
      $input.focus();
    }
  }

  $form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (busy) {
      // Send button abhi "Stop" mode mein hai (busy → disabled nahi, bas
      // icon badla hai) — isi click se chal rahi request abort ho jaati hai.
      stopGeneration();
      return;
    }
    const text = $input.value.trim();
    if (!text && attachedFiles.length === 0) return;
    if (attachedFiles.some((f) => f.status === 'reading')) return; // file abhi padhi ja rahi hai, thoda ruko

    // Termux-connect quick action — AI ko bypass karke seedha deterministic
    // UI dikhate hain (isliye ye AI history mein bhi push nahi hota, ye
    // sirf ek shortcut hai, real conversation turn nahi).
    if (text && attachedFiles.length === 0 && isTermuxConnectIntent(text)) {
      addUserBubble(text, []);
      $input.value = '';
      $input.style.height = 'auto';
      const cfg = loadBridgeConfig();
      addBridgeConnectCard(!!(cfg && cfg.token));
      return;
    }

    const filesMeta = attachedFiles.map((f) => ({ name: f.name, kind: f.kind, status: f.status }));
    const outgoing = buildOutgoingMessage(text, attachedFiles);
    attachedFiles = [];
    renderAttachChips();

    send(outgoing, text, filesMeta);
  });
</script>
</body>
